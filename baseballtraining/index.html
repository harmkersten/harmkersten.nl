<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honkbal Situaties</title>
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Managementgame-stijl (à la Football Manager): donker, vlakke panelen met een kopbalk,
   één accentkleur, geen schaduwen of decoratie */
:root{
  color-scheme:dark;
  --bg:#0f1115; --panel:#171a20; --panel2:#1d2129; --head:#1f232b; --line:#2a2f39; --line2:#353b47;
  --text:#e4e7ec; --muted:#8a93a3; --dim:#646c7a;
  --acc:#4c8dff; --acc-dk:#3a76e0; --acc-soft:rgba(76,141,255,.14);
  --good:#3fb96b; --good-bg:rgba(63,185,107,.12); --bad:#f2555a; --bad-bg:rgba(242,85,90,.12);
  --me:#4c8dff; --pl:#e4e7ec;
  --grass:#2c5a37; --grass2:#295433; --dirt:#6e5641; --wall:#1d3b25;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--body);font-feature-settings:"tnum";-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit}

/* topbalk */
header{position:sticky;top:0;z-index:5;background:#0b0d10;border-bottom:1px solid var(--line);padding:0 16px;padding-top:env(safe-area-inset-top)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;height:52px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:var(--text)}
.logo svg{width:26px;height:26px;flex:none}
.logo span{white-space:nowrap;line-height:1}
.logo span em{display:block;font:700 15px/1 var(--body);font-style:normal}
.logo span small{display:block;font:500 11px/1 var(--body);color:var(--muted);margin-top:4px}
nav{display:flex;height:100%;margin-left:12px}
nav button{border:0;background:none;padding:0 14px;font:600 13px/1 var(--body);cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
.langtg{display:flex;margin-left:auto;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.langtg button{border:0;background:none;padding:5px 9px;font:600 11.5px/1 var(--body);cursor:pointer;color:var(--muted)}
.langtg button.on{background:var(--panel2);color:var(--text)}
@media (max-width:520px){.hwrap{gap:6px}.logo span{display:none}nav{margin-left:0}nav button{padding:0 10px}}

main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.screen{display:none}.screen.on{display:block}
h1{font:700 24px/1.2 var(--body);letter-spacing:-.01em;margin:0 0 4px;color:var(--text)}
h2{font:600 16px/1.3 var(--body);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;max-width:64ch}

/* panelen met kopbalk */
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;position:relative}
.card[data-title]::before{content:attr(data-title);display:block;margin:-16px -16px 14px;padding:9px 16px;background:var(--head);border-bottom:1px solid var(--line);
  font:600 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-radius:4px 4px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid2.solo{grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}
.grid2.solo .stickyfield{display:none}
.stickyfield{position:sticky;top:68px}
@media (max-width:820px){.stickyfield{position:static}#play .field{max-height:38vh}#play .legend{font-size:11px}}

/* veld */
.field{width:100%;height:auto;display:block;background:transparent;touch-action:manipulation}
.pl{transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.pl circle.body{fill:var(--pl);stroke:#0f1115;stroke-width:1.5}
.pl text{fill:#0f1115;font:700 8.6px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl.me circle.body{fill:var(--me);stroke:#fff;stroke-width:1.8}
.pl.me text{fill:#fff}
.pl .ring{fill:none;stroke:var(--me);stroke-width:2;opacity:.9;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.pick .pl{cursor:pointer}
.pick .pl:hover circle.body{fill:var(--acc)}
.mv{fill:none;stroke:#c9d0db;stroke-width:1.5;opacity:0;transition:opacity .5s .5s}
.mv.me{stroke:var(--me);stroke-width:2.4}
.show .mv{opacity:.8}
.hit{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:5 3;opacity:.7}
.hit.fly{stroke-width:1.8;stroke-dasharray:.1 4;stroke-linecap:round}
.throw{fill:none;stroke:#ffb020;stroke-width:2.2;stroke-dasharray:5 3}
.tag{font:700 7.5px var(--body);fill:#fff;text-anchor:middle;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px/1.2 var(--body);color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.legend i.l{width:16px;height:0;border-top:2px dashed #ffb020;border-radius:0;vertical-align:3px}
.legend i.a{width:16px;height:0;border-top:2px solid #c9d0db;border-radius:0;vertical-align:3px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* instellingen */
.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:4px;overflow:hidden;margin-bottom:4px}
.modes button{border:0;background:none;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.modes button+button{border-left:1px solid var(--line2)}
.modes button b{font:600 14px/1.2 var(--body)}
.modes button span{font-size:12px;color:var(--muted)}
.modes button.on{background:var(--acc-soft);box-shadow:inset 0 -2px 0 var(--acc)}
.lbl{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.posgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.posbtn{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:0 12px 0 10px;height:58px;text-align:left;cursor:pointer;
  display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;column-gap:11px;position:relative}
.posbtn .num{width:30px;height:30px;border-radius:3px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line2);color:var(--muted);font:600 13px/1 var(--body);font-style:normal}
.posbtn .pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.posbtn b{font:700 14px/1 var(--body);letter-spacing:.01em}
.posbtn span{font-size:12px;line-height:1.1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posbtn .st{position:absolute;right:10px;top:15px;font:600 11px/14px var(--body);color:var(--dim);font-variant-numeric:tabular-nums}
.posbtn:hover{border-color:var(--line2);background:#222731}
.posbtn.on{border-color:var(--acc);background:var(--acc-soft)}
.posbtn.on .num{background:var(--acc);border-color:var(--acc);color:#fff}
.posbtn.all{grid-column:1/-1;height:48px}
.posbtn.all .num{font-size:10.5px;letter-spacing:-.02em}
.posbtn.all .pt{flex-direction:row;align-items:baseline;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:1px solid var(--line2);background:none;padding:5px 10px;border-radius:3px;font:500 12.5px/1.2 var(--body);cursor:pointer;color:var(--muted)}
.chip.on{background:var(--panel2);border-color:var(--acc);color:var(--text)}
.big{display:block;width:100%;border:0;background:var(--acc);color:#fff;font:600 14px/1 var(--body);padding:13px;border-radius:4px;cursor:pointer;margin-top:18px}
.big:hover:not(:disabled){background:var(--acc-dk)}
.big:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:9px 14px;border-radius:4px;font:600 13px/1 var(--body);cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}

/* spelen */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.pill{font:600 13px/1 var(--body);white-space:nowrap;color:var(--muted)}
.pill.me{color:var(--text);padding-left:10px;border-left:3px solid var(--me)}
#pScore{color:var(--good)}
.prog{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog div{height:100%;background:var(--acc);width:0;transition:width .3s}
.stop{border:0;background:none;color:var(--muted);font:500 12.5px/1 var(--body);cursor:pointer}
.stop:hover{color:var(--text)}

.sit .kind{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.sit h1{font-size:22px;margin:0 0 2px}
.sit .run{font-size:14px;color:var(--muted)}
.q{font:600 15px/1.35 var(--body);margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:10px 12px;cursor:pointer;font:400 14.5px/1.4 var(--body);color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:22px;height:22px;border-radius:3px;border:1px solid var(--line2);color:var(--muted);display:grid;place-items:center;font:600 12px/1 var(--body)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:#0f1115}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:#0f1115}
.opt.fade{opacity:.4}
.fb{margin-top:14px;padding:12px 14px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid}
.fb.ok{border-left-color:var(--good)}
.fb.no{border-left-color:var(--bad)}
.fb h3{margin:0 0 6px;font:700 15px/1.3 var(--body)}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.fb p{margin:6px 0;font-size:14.5px}
.fb b{font-weight:600}
.fb .idea{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px;color:#c7ccd5}
.fb .idea b{display:block;font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.quote{font-size:13px;color:var(--muted);font-style:italic}
.srcl{font-size:12px;color:var(--dim);margin-top:4px}
details{margin-top:10px}
summary{cursor:pointer;font:600 13px/1.2 var(--body);color:var(--muted)}
summary:hover{color:var(--text)}
.who{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column}
.who li{display:flex;gap:10px;font-size:13.5px;align-items:flex-start;padding:5px 6px;border-bottom:1px solid var(--line)}
.who li:last-child{border-bottom:0}
.who li.me{background:var(--acc-soft)}
.who li b{flex:none;width:30px;font:600 12px/20px var(--body);color:var(--muted)}
.who li.me b{color:var(--acc)}
.next{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
.kbd{font-size:11.5px;color:var(--dim);margin-top:10px;text-align:right}
@media (hover:none){.kbd{display:none}}

/* resultaat */
.score{font:700 52px/1 var(--body);letter-spacing:-.02em;color:var(--text)}
.miss{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.miss li{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:9px 12px;font-size:14px}
.miss li .t{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

/* studeren */
.slist{display:flex;flex-direction:column;gap:14px}
.sgroup h3{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 7px}
.sitems{display:flex;flex-wrap:wrap;gap:5px}
.sitem{border:1px solid var(--line2);background:none;padding:4px 9px;border-radius:3px;font:500 12.5px/1.3 var(--body);cursor:pointer;color:var(--muted)}
.sitem:hover{color:var(--text)}
.sitem.on{border-color:var(--acc);background:var(--acc-soft);color:var(--text)}
.who.study li{cursor:pointer;flex-direction:column;gap:2px;padding:8px 6px}
.who.study li .h{display:flex;gap:10px;align-items:flex-start}
.who.study li .why{display:none;font-size:13.5px;color:var(--muted);margin-left:40px}
.who.study li.me .why{display:block}
.who.study li:hover{background:var(--panel2)}
@media (max-width:480px){.card{padding:12px}.card[data-title]::before{margin:-12px -12px 12px;padding:9px 12px}.posgrid{gap:4px}.posbtn{padding:8px 6px 9px 7px;column-gap:7px;row-gap:6px;grid-template-columns:22px minmax(0,1fr);grid-template-rows:22px auto;align-content:center;height:62px}.posbtn .pt{display:contents}.posbtn .num{width:22px;height:22px;font-size:11px}.posbtn span{grid-column:1/-1;font-size:10.5px;letter-spacing:-.01em}.posbtn .st{font-size:10px;right:8px;top:13px}.posbtn.all{height:auto;grid-template-rows:auto}.posbtn.all .pt{display:flex;flex-direction:column;gap:3px}.posbtn.all span{grid-column:auto}.posbtn.all .num{width:30px;height:30px}.posbtn.all{grid-template-columns:30px minmax(0,1fr);padding:9px 10px}h1{font-size:21px}.sit h1{font-size:20px}}
@media (max-width:374px){.posbtn span{font-size:9.5px;letter-spacing:-.02em}.posbtn{padding-left:6px;padding-right:5px}}
@media (prefers-reduced-motion: reduce){.pl,.mv{transition:none!important}.pl .ring{animation:none}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <button class="logo" id="home" data-i18n-aria="toStart">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="#e4e7ec"/><path d="M7.6 5.6c2 1.9 3 4.4 3 7.4s-1 5.5-3 7.4M18.4 5.6c-2 1.9-3 4.4-3 7.4s1 5.5 3 7.4" fill="none" stroke="#4c8dff" stroke-width="1.5" stroke-dasharray="1.8 1.4"/></svg>
      <span><em data-i18n="appName"></em><small data-i18n="appTag"></small></span>
    </button>
    <nav>
      <button data-go="setup" class="on" data-i18n="tabPlay"></button>
      <button data-go="study" data-i18n="tabStudy"></button>
    </nav>
    <div class="langtg" role="group" aria-label="Taal / Language">
      <button data-lang="nl">NL</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- START -->
  <section class="screen on" id="setup">
    <div class="grid2">
      <div>
        <h1 data-i18n="setupTitle"></h1>
        <p class="sub" data-i18n="setupSub"></p>
        <div data-i18n-title="pnlField" class="card fieldbox">
          <svg class="field pick" id="pickField" viewBox="0 105 400 320" role="img"></svg>
          <div class="note" data-i18n="pickNote"></div>
        </div>
      </div>
      <div>
        <div data-i18n-title="pnlSetup" class="card">
          <div class="modes" id="modeSw">
            <button data-m="sit" class="on"><b data-i18n="modeSit"></b><span data-i18n="modeSitSub"></span></button>
            <button data-m="theory"><b data-i18n="modeTh"></b><span data-i18n="modeThSub"></span></button>
          </div>
          <div id="sitOpts">
          <div class="lbl" data-i18n="lblPos"></div>
          <div class="posgrid" id="posGrid"></div>
          <div class="lbl" data-i18n="lblType"></div>
          <div class="chips" id="fType">
            <button class="chip on" data-v="fly" data-i18n="chipFly"></button>
            <button class="chip on" data-v="ground" data-i18n="chipGround"></button>
            <button class="chip on" data-v="xbh" data-i18n="chipXbh"></button>
            <button class="chip on" data-v="tag" data-i18n="chipTag"></button>
            <button class="chip on" data-v="pop" data-i18n="chipPop"></button>
            <button class="chip on" data-v="bunt" data-i18n="chipBunt"></button>
          </div>
          <div class="lbl" data-i18n="lblRun"></div>
          <div class="chips" id="fRun">
            <button class="chip on" data-v="0" data-i18n="chipR0"></button>
            <button class="chip on" data-v="1" data-i18n="chipR1"></button>
            <button class="chip on" data-v="2" data-i18n="chipR2"></button>
            <button class="chip on" data-v="12" data-i18n="chipR12"></button>
            <button class="chip on" data-v="3" data-i18n="chipR3"></button>
          </div>
          </div>
          <p class="note" id="thNote" style="display:none" data-i18n="thNote"></p>
          <div class="lbl" data-i18n="lblLen"></div>
          <div class="chips" id="fLen">
            <button class="chip" data-v="5">5</button>
            <button class="chip on" data-v="10">10</button>
            <button class="chip" data-v="20">20</button>
            <button class="chip" data-v="999" data-i18n="chipAll"></button>
          </div>
          <button class="big" id="startBtn"></button>
          <div class="note" id="poolNote"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SPELEN -->
  <section class="screen" id="play">
    <div class="bar">
      <span class="pill me" id="pPos"></span>
      <span class="pill" id="pCount"></span>
      <div class="prog"><div id="pProg"></div></div>
      <span class="pill" id="pScore"></span>
      <button class="stop" id="stopBtn" data-i18n="stop"></button>
    </div>
    <div class="grid2">
      <div class="stickyfield">
        <div data-i18n-title="pnlField" class="card fieldbox">
          <svg class="field" id="playField" viewBox="0 105 400 320" role="img"></svg>
          <div class="legend"><span><i style="background:var(--me)"></i><span data-i18n="lgYou"></span></span><span><i style="background:#e4572e"></i><span data-i18n="lgRunner"></span></span><span><i style="background:#fff;border:1px solid #999"></i><span data-i18n="lgBall"></span></span><span><i class="a"></i><span data-i18n="lgMove"></span></span><span><i class="l"></i><span data-i18n="lgThrow"></span></span></div>
        </div>
      </div>
      <div>
        <div data-i18n-title="pnlSit" class="card sit">
          <div class="kind" id="sKind"></div>
          <h1 id="sTitle"></h1>
          <div class="run" id="sRun"></div>
          <div class="q" id="sQ"></div>
          <div class="opts" id="opts"></div>
          <div id="fb"></div>
          <div class="kbd" data-i18n="kbd"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- RESULTAAT -->
  <section class="screen" id="result">
    <div data-i18n-title="pnlResult" class="card" style="max-width:720px;margin:0 auto">
      <div class="lbl" style="margin-top:0" id="rPos"></div>
      <div class="score" id="rScore"></div>
      <p id="rMsg" style="font-size:17px;margin:8px 0 0"></p>
      <div id="rMiss"></div>
      <div class="row">
        <button class="btn pri" id="retryMiss" data-i18n="retryMiss"></button>
        <button class="btn" id="again" data-i18n="again"></button>
        <button class="btn" id="toSetup" data-i18n="toSetup"></button>
      </div>
    </div>
  </section>

  <!-- STUDEREN -->
  <section class="screen" id="study">
    <h1 data-i18n="studyTitle"></h1>
    <p class="sub" data-i18n="studySub"></p>
    <div class="grid2">
      <div class="stickyfield">
        <div data-i18n-title="pnlField" class="card fieldbox">
          <svg class="field" id="studyField" viewBox="0 105 400 320" role="img"></svg>
          <div class="legend"><span><i style="background:var(--me)"></i><span data-i18n="lgChosen"></span></span><span><i style="background:#e4572e"></i><span data-i18n="lgRunner"></span></span><span><i class="a"></i><span data-i18n="lgMove"></span></span><span><i class="l"></i><span data-i18n="lgThrow"></span></span></div>
          <div class="row" style="margin-top:10px"><button class="btn" id="replay" data-i18n="replay"></button></div>
        </div>
      </div>
      <div>
        <div data-i18n-title="pnlList" class="card" style="margin-bottom:14px"><div class="slist" id="slist"></div></div>

/* ---------- aantal uit: bij grondballen met lopers hangt de keuze van de veldspeler ervan af ----------
   per aantal uit: waar de worp heen gaat (to) en welke antwoorden goed zijn (ok; de eerste is de beste) */
function outsPlan(S){
  const k=runKey(S), f=S.ball, orig=S.d[f][0];
  if(k==='1') return {0:{to:'2B',ok:['field_2B']},1:{to:'2B',ok:['field_2B']},
    2:f==='1B'?{to:'1B',ok:['field_run1B','field_2B']}:{to:'2B',ok:['field_2B','field_1B']}};
  if(k==='2') return {0:{to:'1B',ok:[orig]},1:{to:'1B',ok:[orig]},
    2:{to:'1B',ok:f==='1B'?['field_run1B',orig]:['field_1B',orig]}};
  if(k==='12') return {
    '3B':{0:{to:'3B',ok:['field_tag3','field_2B']},1:{to:'2B',ok:['field_2B','field_tag3']},2:{to:'3B',ok:['field_tag3','field_2B','field_1B']}},
    SS:{0:{to:'3B',ok:['field_3B','field_2B']},1:{to:'2B',ok:['field_2B','field_3B']},2:{to:'2B',ok:['field_2B','field_3B','field_1B']}},
    '2B':{0:{to:'2B',ok:['field_2B']},1:{to:'2B',ok:['field_2B']},2:{to:'2B',ok:['field_2B','field_1B']}},
    '1B':{0:{to:'1B',ok:['field_run1B_check3','field_2B']},1:{to:'2B',ok:['field_2B','field_run1B_check3']},2:{to:'1B',ok:['field_run1B_check3','field_2B']}},
    P:{0:{to:'3B',ok:['field_3B','field_2B']},1:{to:'2B',ok:['field_2B','field_3B']},2:{to:'3B',ok:['field_3B','field_2B','field_1B']}},
  }[f];
  return null;
}
SIT.forEach(S=>{ if(S.type==='ground' && S.run.length) S.ov=outsPlan(S); });
/* de situatie zoals hij met n uit gespeeld wordt */
function withOuts(S,n){
  const v=S.ov[n], f=S.ball, same=v.ok[0]===S.d[f][0];
  const eq=n===2||(n===0&&runKey(S)==='12');   // alle goede antwoorden even goed
  return Object.assign({},S,{base:S,outN:n,to:v.to,ok:v.ok,okEq:eq,d:Object.assign({},S.d,{[f]:same?S.d[f]:[v.ok[0],null,'EXP']})});
}
/* welke antwoorden goed zijn voor deze positie */
const okSet = (S,p) => (S.ok && p===S.ball) ? S.ok : [S.d[p][0]];
const OUTS = n => L(`${n} uit`, n===1?'1 out':`${n} outs`);
/* uitleg voor de veldspeler bij n uit */
function outsWhy(S,n){
  const k=runKey(S), f=S.ball;
  if(k==='1'){
    if(n<2) return L(`Met ${n} uit ga je voor het dubbelspel: force out op het tweede honk en dan door naar het eerste. Twee uit in één keer.`,
                     `With ${n} out${n===1?'':'s'} you go for the double play: force out at second, then on to first. Two outs at once.`);
    return f==='1B'?L('Met 2 uit heb je maar één uit nodig om de inning te beëindigen. Jij staat vlak bij het eerste honk: stap er zelf op of gooi naar de werper. Naar het tweede honk gooien mag ook.',
                      'With 2 outs you only need one out to end the inning. You are right next to first base: step on it yourself or flip to the pitcher. Throwing to second is fine too.')
      :L('Met 2 uit heb je maar één uit nodig om de inning te beëindigen. Neem de zekerste: de force out op het tweede honk of de slagman op het eerste honk. Kies wat het kortst en veiligst is.',
         'With 2 outs you only need one out to end the inning. Take the surest one: the force out at second or the batter at first. Pick whatever is shortest and safest.');
  }
  if(k==='2'){
    if(n<2) return L(`Met ${n} uit telt de loper op het tweede honk: hij mag niet zomaar naar het derde. `,`With ${n} out${n===1?'':'s'} the runner on second matters: he can't just walk to third. `)+A[S.d[f][0]].why(S,f);
    return L('Met 2 uit maakt de loper op het tweede honk niet meer uit: een uit op het eerste honk beëindigt de inning voordat hij kan scoren. Gooi meteen en zeker naar het eerste honk. Eerst even terugkijken mag ook, maar is niet nodig.',
             'With 2 outs the runner on second no longer matters: an out at first ends the inning before he can score. Throw straight and sure to first. Looking him back first is fine too, but not needed.');
  }
  if(n===0){
    if(f==='2B') return L('Met 0 uit wil je een dubbelspel. Voor jou is de worp naar het derde honk lang en dwars over het veld, dus start je het dubbelspel via het tweede honk (4-6-3).',
                          'With 0 outs you want a double play. For you the throw to third is long and across the diamond, so you start the double play through second (4-6-3).');
    if(f==='1B') return L('Met 0 uit heb je twee goede keuzes: de zekere uit op het eerste honk (en de loper richting het derde in de gaten houden), of het dubbelspel 3-6-1 via het tweede honk. Allebei goed.',
                          'With 0 outs you have two good options: the sure out at first (and watch the runner heading to third), or the 3-6-1 double play through second. Both are fine.');
    return L(`Met 0 uit heb je twee goede keuzes. De voorste loper uitmaken op het derde honk: dan staat er straks geen loper op het derde met maar 1 uit. Of het dubbelspel via het tweede honk: twee uit, maar wel een loper op het derde. Beide zijn goed; coaches verschillen hierin van mening.`,
             `With 0 outs you have two good options. Get the lead runner at third: then there is no runner on third with just 1 out. Or turn the double play through second: two outs, but a runner ends up on third. Both are fine; coaches differ on this.`);
  }
  if(n===1) return f==='2B'?L('Met 1 uit beëindigt een dubbelspel de inning. Start het via het tweede honk (4-6-3).','With 1 out a double play ends the inning. Start it through second (4-6-3).')
    :L(`Met 1 uit beëindigt een dubbelspel de inning, dus dat is de beste keuze: via het tweede honk en door naar het eerste.${f==='1B'?'':' De voorste loper op het derde honk uitmaken kan ook, maar dan gaat de inning door.'}`,
       `With 1 out a double play ends the inning, so that is the best choice: through second and on to first.${f==='1B'?'':' Getting the lead runner at third also works, but then the inning goes on.'}`);
  const near={'3B':['Voor jou is dat gewoon zelf op het derde honk stappen.','For you that is simply stepping on third yourself.'],
    SS:['Voor jou is dat meestal het tweede honk (korte worp), maar het derde of eerste honk is ook goed.','For you that is usually second base (short throw), but third or first is fine too.'],
    '2B':['Voor jou is dat het tweede honk (korte worp) of het eerste honk.','For you that is second base (short throw) or first base.'],
    '1B':['Voor jou is dat gewoon zelf op het eerste honk stappen.','For you that is simply stepping on first yourself.'],
    P:['Voor jou is dat het derde of het tweede honk; het eerste honk is ook goed.','For you that is third or second base; first base is fine too.']}[f];
  return L(`Met 2 uit heb je maar één uit nodig. Neem de makkelijkste force out: het honk dat het dichtstbij is of waar de worp het kortst is. ${near[0]}`,
           `With 2 outs you only need one out. Take the easiest force out: the closest base or the shortest throw. ${near[1]}`);
}
/* in de studeermodus: overzicht per aantal uit */
function outsSummary(S){
  return [0,1,2].map(n=>`${OUTS(n)}: ${S.ov[n].ok.map(a=>lbl(a).toLowerCase()).join(L(' — of — ',' — or — '))}`).join('. ')+'.';
}

/* ---------- het idee achter een situatie ---------- */
function idea(S){
  const k = runKey(S);
  if(S.outN!==undefined){
    const n=S.outN;
    if(k==='1') return n<2?L('De loper op het eerste honk moet doorlopen. Met minder dan 2 uit is het dubbelspel het doel: force out op het tweede honk en door naar het eerste.','The runner on first is forced. With less than 2 outs the goal is the double play: force out at second and on to first.')
                          :L('Met 2 uit is één uit genoeg om de inning te beëindigen. Neem de zekerste uit.','With 2 outs one out ends the inning. Take the surest out.');
    if(k==='2') return n<2?L('De loper op het tweede honk is níet gedwongen. Kijk hem terug zodat hij niet naar het derde gaat, en maak de zekere uit op het eerste honk.','The runner on second is NOT forced. Look him back so he doesn\'t go to third, then take the sure out at first.')
                          :L('Met 2 uit beëindigt een uit op het eerste honk de inning; de loper op het tweede telt dan niet meer.','With 2 outs an out at first ends the inning; the runner on second no longer matters.');
    return [L('Lopers op 1 en 2, 0 uit: zowel de voorste loper op het derde honk als een dubbelspel via het tweede honk is een goede keuze.','Runners on 1st and 2nd, 0 outs: both the lead runner at third and a double play through second are good choices.'),
            L('Lopers op 1 en 2, 1 uit: een dubbelspel beëindigt de inning, dus dat heeft de voorkeur.','Runners on 1st and 2nd, 1 out: a double play ends the inning, so that is preferred.'),
            L('Lopers op 1 en 2, 2 uit: één uit is genoeg. Neem de makkelijkste force out.','Runners on 1st and 2nd, 2 outs: one out is enough. Take the easiest force out.')][n];
  }
  if(S.type==='fly'){
    if(k==='0') return L('Geen lopers: alleen de slagman loopt. De bal moet zo snel mogelijk naar het tweede honk, zodat de slagman niet verder komt dan het eerste honk.',
                         'No runners: only the batter is running. The ball has to get to second base as fast as possible, so the batter stops at first.');
    if(k==='1') return L('De loper op het eerste honk probeert bij een slag naar het outfield door te lopen naar het derde honk. Daarom gaat de worp naar het derde honk.',
                         'On a hit to the outfield, the runner on first tries to go all the way to third. That is why the throw goes to third base.');
    return L('De loper op het tweede honk probeert te scoren, dus de worp gaat naar de thuisplaat. Bij een worp naar huis is de cut-off de derde honkman (bal in het linksveld) of de eerste honkman (bal in het midden- of rechtsveld).',
             'The runner on second tries to score, so the throw goes home. On a throw home the cut-off is the third baseman (ball in left field) or the first baseman (ball in center or right field).');

  if(S.type==='xbh'){

    return L('Een tweehonkslag met een loper op het eerste honk: die loper probeert te scoren. Is het eerste honk bezet, dan lijn je op naar de thuisplaat, met een relay-man, een trailer en een tweede cut-off.',

  }
  if(S.type==='tag') return L('Vangbal met minder dan twee uit en lopers op 1 en 3: de loper op het derde honk tagt op (wacht tot de vangst) en probeert te scoren. De worp gaat laag naar huis via de cut-off. Laat ook de loper op het eerste honk niet zomaar doorlopen naar het tweede.',
                              'Fly out with less than two outs and runners on 1st and 3rd: the runner on third tags up (waits for the catch) and tries to score. The throw goes low to home through the cut-off. Don\'t let the runner on first walk into second either.');
  if(S.type==='pop') return L('Een korte pop-up tussen infield en outfield: meerdere spelers kunnen erbij, dus roepen is alles. Volgorde van voorrang: midvelder, dan links- en rechtsvelder, dan korte stop, tweede, derde en eerste honkman, catcher en als laatste de werper. Wie de bal heeft roept luid "I got it!".',
                              'A shallow pop fly between infield and outfield: several players can get there, so calling is everything. Priority order: center fielder, then left and right fielders, then shortstop, second, third and first basemen, catcher and last the pitcher. Whoever takes it yells "I got it!".');
  if(S.type==='bunt'){

                            'Squeeze: the runner on third breaks for home on the pitch and the batter bunts. Everyone close charges in: try to get the runner at home, otherwise take the sure out at first.');
    if(k==='1') return L('Opofferingsstootslag met een loper op het eerste honk. Eerste doel is een zekere uit (meestal op het eerste honk); alleen bij een slechte bunt pak je de voorste loper op het tweede honk. De catcher ziet alles en roept waar de bal heen moet.',
                         'Sacrifice bunt with a runner on first. The first goal is a sure out (usually at first base); only on a bad bunt do you go for the lead runner at second. The catcher sees everything and calls where the ball goes.');
    return L('Stootslag met lopers op 1 en 2: het team gaat voor de zekere uit op het eerste honk. De binnenvelders stormen naar de bal, de tweede honkman dekt het eerste honk en de catcher roept waar de bal heen moet.',
             'Bunt with runners on 1st and 2nd: the team goes for the sure out at first. The corner infielders and pitcher charge, the second baseman covers first and the catcher calls where the ball goes.');
  }
  if(k==='0') return L('Geen lopers: de enige uit die je kunt maken is de slagman op het eerste honk.','No runners: the only out you can get is the batter at first base.');
  if(k==='1') return L('De loper op het eerste honk moet doorlopen (gedwongen). Je pakt de voorste loper: force out op het tweede honk, en misschien lukt nog een dubbelspel.',
                       'The runner on first is forced to run. Get the lead runner: force out at second base, and maybe turn a double play.');
  if(k==='2') return L('De loper op het tweede honk is níet gedwongen om te lopen. Kijk hem eerst terug zodat hij blijft staan, en maak dan de zekere uit op het eerste honk.',
                       'The runner on second is NOT forced to run. Look him back first so he stays put, then take the sure out at first base.');
  if(S.ball==='1B') return L('Beide lopers zijn gedwongen, maar de eerste honkman staat ver van het derde honk. Hij neemt de zekere uit op het eerste honk en houdt de loper richting het derde honk in de gaten.',
                             'Both runners are forced, but the first baseman is far from third base. He takes the sure out at first and keeps an eye on the runner heading to third.');
  if(S.ball==='3B') return L('Beide lopers zijn gedwongen. Pak de voorste loper: de derde honkman staat er zelf het dichtst bij en tikt de loper uit of stapt op het honk.',
                             'Both runners are forced. Get the lead runner: the third baseman is closest, so he tags the runner or steps on the bag.');
  if(S.ball==='2B') return L('Beide lopers zijn gedwongen. De tweede honkman staat ver van het derde honk, maar vlak bij het tweede: hij start het dubbelspel 4-6-3 (tweede honk, dan eerste honk). Een lange worp dwars over het veld naar het derde honk is te riskant.',
                             'Both runners are forced. The second baseman is far from third but close to second: he starts the 4-6-3 double play (second, then first). A long throw across the diamond to third is too risky.');
  if(S.ball==='SS') return L('Beide lopers zijn gedwongen. Pak de voorste loper: force out op het derde honk. Met minder dan twee uit is een dubbelspel via het tweede honk (6-4-3) ook een goede keuze; dit boekje kiest voor de voorste loper.',
                             'Both runners are forced. Get the lead runner: force out at third. With less than two outs a double play through second (6-4-3) is also a good choice; this booklet goes for the lead runner.');
  return L('Beide lopers zijn gedwongen. Pak de voorste loper: force out op het derde honk.','Both runners are forced. Get the lead runner: force out at third base.');
}
const cutPos = S => POS.find(p=>['cutoff','cover2B_or_cut','relay_lead'].includes(S.d[p][0]));

  bunt_charge_1B:{l:()=>L('Naar binnen stormen en het gebied tussen de eerste-honklijn en de heuvel nemen','Charge in and cover the area between the first-base line and the mound'),g:['bunt1'],

  bunt_charge_3B:{l:()=>L('Naar de thuisplaat stormen voor de bunt, en terug naar je honk als een ander hem pakt','Charge toward home for the bunt, and get back to your base if someone else fields it'),g:['bunt3'],

    why:S=>L(`De worp van ${de(S.ball)} naar ${BN(S.to)} is lang. Jij gaat in één lijn staan tussen de bal en ${BN(S.to)}. Komt de worp niet goed aan, dan vang jij hem op en gooi je hem door (relay).`,
             `The throw from ${de(S.ball)} to ${BN(S.to)} is a long one. You line up between the ball and ${BN(S.to)}. If the throw is off, you catch it and relay it on.`)
      +(S.to==='H'?L(` Bij een worp naar huis is de cut-off ${S.ball==='LF'?'de derde honkman, want die staat het dichtst bij de lijn van links naar huis':'de eerste honkman: de korte stop en de tweede honkman zijn nodig op de honken'}. De catcher roept of je moet afsnijden.`,
                     ` On a throw home the cut-off is ${S.ball==='LF'?'the third baseman, who is closest to the line from left field to home':'the first baseman: the shortstop and second baseman are needed at the bases'}. The catcher tells you whether to cut it.`):''),
    no:S=>cutPos(S)?L(`De cut-off staat in lijn tussen de bal en ${BN(S.to)}. Dat doet ${de(cutPos(S))}.`,`The cut-off lines up between the ball and ${BN(S.to)}. That is ${de(cutPos(S))}'s job.`)
      :L('Bij een grondbal in het infield is geen cut-off nodig: de worp is kort genoeg om direct te gooien.','On a ground ball in the infield no cut-off is needed: the throw is short enough to go straight to the base.')},
  cover2B_or_cut:{l:()=>L('Het tweede honk dekken als de bal aan de kant van je partner komt, anders cut-off zijn','Cover second base if the ball is on your partner\'s side, otherwise be the cut-off'),g:['c2','cut'],
    why:S=>L('Bij een fly ball naar het midveld bewegen de tweede honkman en de korte stop allebei richting de bal. Komt de bal aan de kant van je partner, dan dek jij het tweede honk. Komt hij aan jouw kant, dan ben jij de cut-off. Zo staat er altijd één op het honk en één in de lijn van de worp.',
             'On a fly ball to center, the second baseman and shortstop both move toward the ball. If it\'s on your partner\'s side, you cover second. If it\'s on your side, you are the cut-off. That way one is always on the bag and one is in line with the throw.')},
  cover1B:{l:()=>L('Het eerste honk dekken','Cover first base'),g:['c1'],why:(S,pos)=>{
    if(S.type==='bunt' && pos==='2B') return L('Bij een stootslag stormen de eerste honkman en de werper naar binnen, dus het eerste honk is leeg. Jij als tweede honkman dekt het: daar gaat de worp voor de zekere uit meestal heen.',
      'On a bunt the first baseman and pitcher charge in, so first base is empty. As second baseman you cover it: that is where the throw for the sure out usually goes.');
    if(pos==='2B') return L('De eerste honkman is de cut-off naar de thuisplaat, dus het eerste honk is leeg. Jij dekt het, zodat de cut-off de slagman of loper daar nog kan uitmaken.',
      'The first baseman is the cut-off to home plate, so first base is empty. You cover it, so the cut-off can still throw out the batter or runner there.');
    if(pos==='P' && S.type==='pop') return L('De eerste honkman gaat achter de pop-up aan, dus het eerste honk is leeg. Jij als werper dekt het en houdt de loper op het eerste honk in de gaten.',
      'The first baseman goes after the pop-up, so first base is empty. As the pitcher you cover it and keep an eye on the runner on first.');
    if(S.type==='pop' || S.type==='tag') return L('Blijf bij je honk en houd de loper op het eerste honk in de gaten. Roep naar je teamgenoten wat hij doet: loopt hij te ver uit, dan kan de bal naar jou.',
      'Stay at your base and watch the runner on first. Tell your teammates what he is doing: if he strays too far, the ball can come to you.');
    if(pos==='P') return L(`${cap(de(S.ball))} gaat naar de bal, dus het eerste honk is leeg. Als werper sprint je meteen naar het eerste honk (eerst richting de lijn, dan langs de lijn) om de worp te ontvangen.`,
                           `${cap(de(S.ball))} goes for the ball, so first base is empty. As the pitcher you sprint to first right away (first toward the line, then along it) to take the throw.`);
    if(S.to==='1B') return L('De worp gaat naar het eerste honk om de slagman uit te maken. Jij staat met je voet op het honk en strekt je richting de worp.',
                             'The throw goes to first to get the batter out. Put your foot on the bag and stretch toward the throw.');
    return L(`De eerste worp gaat naar ${BN(S.to)}, maar jij dekt het eerste honk. Lukt de force out, dan kan er misschien nog een dubbelspel naar jouw honk.`,
             `The first throw goes to ${BN(S.to)}, but you cover first. If the force out works, there may be a double play to your bag.`);}},
  cover1B_after_touch:{l:()=>L('Wachten tot de loper het eerste honk aanraakt en dan het honk dekken','Wait until the runner touches first base, then cover the bag'),g:['c1'],
    why:S=>L('Bij een slag naar het outfield loopt de slagman over het eerste honk. Kijk eerst of hij het honk echt aanraakt. Daarna ga je terug op je honk staan, zodat je klaarstaat voor een worp als hij te ver uitloopt.',
             'On a hit to the outfield the batter runs past first base. First check that he actually touches the bag. Then get back on your base, ready for a throw if he rounds it too far.')},
  cover_backup_1B:{l:()=>L('Naar het eerste honk gaan om te dekken of te backuppen','Go to first base to cover or back up'),g:['c1','b1'],
    why:S=>L('De eerste honkman fieldt de bal. Jij gaat naar het eerste honk: dekken als hij naar jou gooit, of erachter als back-up als hij zelf naar het honk loopt.',
             'The first baseman fields the ball. You go to first: cover it if he throws to you, or back him up if he takes the bag himself.')},
  cover2B:{l:()=>L('Het tweede honk dekken','Cover second base'),g:['c2'],why:(S,pos)=>{
    if(pos==='P') return L('De korte stop en de tweede honkman gaan allebei achter de pop-up aan, dus het tweede honk is leeg. Jij als werper dekt het, voor als de loper van het eerste honk doorloopt.',
      'The shortstop and second baseman both go after the pop-up, so second base is empty. As the pitcher you cover it, in case the runner from first keeps going.');

          `The throw goes to second for the force out on the runner from first. ${cap(de(S.ball))} is busy with the ball, so you take the bag and receive that throw.`)

  cover3B:{l:()=>L('Het derde honk dekken','Cover third base'),g:['c3'],why:(S,pos)=>{

                           `Third base is left empty because ${S.ball==='3B'?'the third baseman is fielding the ball':'the third baseman is backing up the shortstop'}. As the pitcher you take over that base, so a runner can't just walk into third.`);
    if(S.to==='3B') return L('De worp gaat naar het derde honk. Jij staat op het honk om de worp te vangen en de loper uit te maken.','The throw goes to third base. You are on the bag to catch it and get the runner out.');
    return L('De bal komt niet naar jou, maar je blijft bij je honk. Zo kan een loper geen extra honk pakken en is er altijd iemand om naartoe te gooien.',

  stay_near3B:{l:()=>L('Dicht bij het derde honk blijven','Stay close to third base'),g:['c3'],
    why:S=>L('Zonder lopers gebeurt er bij het derde honk weinig, maar je blijft dicht bij je honk. Loopt de slagman te ver door, dan moet er iemand op het derde honk staan.',

  cover_backup_3B:{l:()=>L('Naar het derde honk gaan om te dekken of te backuppen','Go to third base to cover or back up'),g:['c3','b3'],

  cover_home:{l:()=>L('De thuisplaat dekken','Cover home plate'),g:['home'],

  protect_home:{l:()=>L('Bij de thuisplaat blijven en die beschermen','Stay at home plate and protect it'),g:['home'],
    why:S=>S.type==='bunt'?L('Squeeze: de loper komt van het derde honk recht op je af. Jij blijft bij de thuisplaat; fieldt een teamgenoot de bunt snel, dan gooit hij naar jou voor de tag.',

      :S.to==='H'?L('Een loper probeert te scoren. Jij blijft bij de thuisplaat, geeft de loper een looplijn en maakt je klaar voor de worp. Jij ziet alles voor je: roep naar de cut-off of hij de bal moet afsnijden ("Cut!") of laten doorgaan.',
                        'A runner is trying to score. You stay at home plate, give the runner a lane and get ready for the throw. You see everything in front of you: tell the cut-off whether to cut the ball ("Cut!") or let it through.')
      :L('Er staan lopers op de honken die kunnen scoren. Als catcher blijf je daarom bij de thuisplaat, zodat niemand ongehinderd thuis kan komen.',
         'There are runners on base who can score. As the catcher you stay at home plate, so nobody can score unchallenged.'),
    no:S=>L('Er staan geen lopers die kunnen scoren, dus de thuisplaat hoeft niet bewaakt te worden.','There are no runners who can score, so home plate doesn\'t need guarding.')},
  follow_runner_1B:{l:()=>L('Met de slagman mee naar het eerste honk rennen voor een overthrow','Run down the line with the batter to back up first base'),g:['fol'],
    why:S=>L('Zonder lopers kan er niemand scoren, dus de thuisplaat hoeft niet bewaakt te worden. Jij rent langs de foutlijn mee naar het eerste honk: gaat een worp mis, dan sta jij erachter.',
             'With no runners nobody can score, so home plate doesn\'t need guarding. You run down the foul line toward first: if a throw gets away, you are behind it.'),
    no:S=>L('Er staan lopers op de honken die kunnen scoren, dus de catcher moet bij de thuisplaat blijven.','There are runners on base who can score, so the catcher has to stay at home plate.')},
  backup_1B:{l:()=>L('Achter het eerste honk gaan staan als back-up','Back up behind first base'),g:['b1'],why:(S,pos)=>
    (S.type==='ground'&&S.ball==='1B')?L('De eerste honkman gaat naar de bal. Jij gaat achter het eerste honk staan: gaat een worp naar het honk mis, dan stop jij de bal.',

  backup_2B:{l:()=>L('Achter het tweede honk gaan staan als back-up','Back up behind second base'),g:['b2'],why:backupBaseWhy('2B')},
  backup_3B:{l:()=>L('Achter het derde honk gaan staan als back-up','Back up behind third base'),g:['b3'],why:(S,pos)=>
    (S.type==='ground'&&S.ball==='3B')?L('De bal gaat naar de derde honkman. Jij gaat achter hem staan: glipt de bal erdoor of laat hij hem vallen, dan pak jij hem op.',

  backup_SS:{l:()=>L('Achter de korte stop gaan staan als back-up','Back up behind the shortstop'),g:['bSS'],why:S=>

  backup_P:{l:()=>L('Achter de werper gaan staan als back-up','Back up behind the pitcher'),g:['bP'],

  backup_LF:backupOF('LF'), backup_CF:backupOF('CF'), backup_RF:backupOF('RF'),
  p_backup_mound_2B:{l:()=>L('Een back-up positie innemen tussen de heuvel en het tweede honk','Move into a back-up spot between the mound and second base'),g:['pm'],

  p_backup_mound_SS:{l:()=>L('Een back-up positie innemen tussen de heuvel en de korte stop','Move into a back-up spot between the mound and the shortstop'),g:['pm'],
    why:S=>L('De worp uit het rechtsveld gaat naar het tweede honk, waar de korte stop dekt. Jij gaat tussen de heuvel en de korte stop staan als back-up voor een worp die mis gaat.',
             'The throw from right field goes to second, where the shortstop covers. You stand between the mound and the shortstop as back-up for a throw that gets away.')},
  p_backup_3B_home:{l:()=>L('Een back-up positie innemen tussen het derde honk en de thuisplaat','Move into a back-up spot between third base and home plate'),g:['ph'],
    why:S=>L(`Als werper heb je bij een slag naar het outfield geen eigen honk. Je gaat tussen het derde honk en de thuisplaat staan: zo kun je de worp naar ${BN(S.to)} backuppen.`,

  p_backup_1B_home:{l:()=>L('Een back-up positie innemen tussen het eerste honk en de thuisplaat','Move into a back-up spot between first base and home plate'),g:['ph','b1'],
    why:S=>S.type==='fly'?L('De worp gaat naar de thuisplaat. Je gaat tussen het eerste honk en de thuisplaat staan, zodat je een worp die langs de catcher gaat kunt opvangen.',
                            'The throw goes home. You stand between first base and home plate, so you can stop a throw that gets past the catcher.')
      :L('De tweede honkman gooit naar het eerste honk. Jij gaat tussen de thuisplaat en het eerste honk staan als back-up voor een worp die mis gaat.',
         'The second baseman throws to first. You stand between home plate and first base as back-up for a throw that gets away.')},
  rf_toward_infield:{l:()=>L('Richting het infield lopen voor een mogelijke back-up','Move toward the infield for a possible back-up'),g:['ti'],

const lbl = a => A[a].l();

/* welke foute opties passen bij een positie */
const POOL = {
  P:['cover1B','cover3B','cover_home','cover2B','backup_1B','backup_3B','backup_2B','backup_home','p_backup_mound_2B','p_backup_mound_SS','p_backup_3B_home','p_backup_1B_home','field_1B','field_2B','field_3B','hold_throw1B','cutoff','cover_backup_1B','cover_backup_3B','bunt_pitcher','bunt_p_3Bline'],
  C:['protect_home','follow_runner_1B','backup_1B','cover3B','backup_3B','cover1B','backup_P','cover_home','bunt_catcher'],
  '1B':['cover1B','cover1B_after_touch','field_run1B','field_1B','field_2B','field_3B','hold_throw1B','cutoff','cover2B','backup_P','backup_2B','trail_runner_2B','trailer','second_cut_home','bunt_charge_1B','popup_priority','popup_yield'],
  '2B':['cover2B','cover2B_or_cut','cutoff','field_1B','field_2B','field_3B','hold_throw1B','backup_1B','backup_P','cover1B','backup_SS','relay_lead','trailer','popup_priority','popup_yield'],
  SS:['cover2B','cover2B_or_cut','cutoff','field_1B','field_2B','field_3B','hold_throw1B','backup_3B','cover3B','backup_2B','backup_P','relay_lead','trailer','popup_priority','popup_yield'],
  '3B':['cover3B','stay_near3B','backup_SS','field_1B','field_2B','field_3B','field_tag3','hold_throw1B','cutoff','cover_home','cover2B','bunt_charge_3B','relay_lead','popup_priority','popup_yield'],
  LF:['backup_3B','backup_SS','backup_CF','backup_2B','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','throw_relay','catch_throw_home','cutoff','rf_toward_infield','cover3B','popup_priority','popup_yield'],
  CF:['backup_2B','backup_LF','backup_RF','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','throw_relay','catch_throw_home','cutoff','cover2B','rf_toward_infield','popup_priority','popup_yield'],
  RF:['backup_1B','backup_2B','backup_CF','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','throw_relay','catch_throw_home','cutoff','rf_toward_infield','cover1B','cover2B','popup_priority','popup_yield'],
};
const SELF = {P:'backup_P','1B':'backup_1B','2B':'backup_2B',SS:'backup_SS','3B':'backup_3B',LF:'backup_LF',CF:'backup_CF',RF:'backup_RF'};
const OUT_ONLY = ['throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','throw_relay','catch_throw_home','rf_toward_infield'];
const P_ONLY = ['backup_home','bunt_pitcher','bunt_p_3Bline','p_backup_mound_2B','p_backup_mound_SS','p_backup_3B_home','p_backup_1B_home'];
const conflicts = (a,b) => a===b || A[a].g.some(x=>A[b].g.includes(x));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function makeOptions(S,pos){
  const correct = S.d[pos][0];
  const isOF = ['LF','CF','RF'].includes(pos);
  const ok = a => a!==SELF[pos] && (isOF || !OUT_ONLY.includes(a)) && (pos==='P' || !P_ONLY.includes(a)) && !(pos==='C' && A[a].field) && !(!S.ball && A[a].field) && !chosen.some(c=>conflicts(a,c));
  const chosen = [correct];
  const add = (list,cap=4) => {let n=0;for(const a of shuffle(list)){if(chosen.length>=4||n>=cap)break;if(ok(a)){chosen.push(a);n++;}}};
  const same = [...new Set(POS.filter(p=>p!==pos).map(p=>S.d[p][0]))];
  add(same.filter(a=>POOL[pos].includes(a)),2);
  add(POOL[pos]);
  add(same);
  add(Object.keys(A));
  return shuffle(chosen);
}

const listPos = ps => { const n=ps.map(de); return n.length===1?n[0]:n.slice(0,-1).join(', ')+L(' en ',' and ')+n[n.length-1]; };
function wrongWhy(S,pos,act){
  const parts=[];
  const who = POS.filter(p=>p!==pos && conflicts(S.d[p][0],act));
  const a = A[act];
  if(a.field && S.ball!==pos) parts.push(L(`De bal gaat niet naar jou, maar naar ${de(S.ball)}.`,`The ball isn't coming to you, it goes to ${de(S.ball)}.`));
  else if(a.field && S.ball===pos && (a.field==='R' || S.d[pos][0]==='throw_relay')) parts.push(L(`De bal is wel voor jou, maar zo moet hij niet naar binnen. ${idea(S)}`,`The ball is yours, but that's not how it should come in. ${idea(S)}`));
  else if(a.field && S.ball===pos) parts.push(a.field===S.to
    ? L(`De bal is wel voor jou, maar je moet het anders aanpakken. ${idea(S)}`,`The ball is yours, but you should handle it differently. ${idea(S)}`)

const NS='http://www.w3.org/2000/svg';

const add2=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];

function throwFrom(base,S){

function target(pos,S){

/* alle doelen, met spelers die op dezelfde plek uitkomen iets uit elkaar */
/* alle doelen; spelers met een vaste plek (honk, bal, thuisplaat) blijven staan,
   de rest wordt uit elkaar geduwd tot ze minstens GAP van iedereen af staan */
const GAP=30;
const anchored = a => !!A[a].field || (a.startsWith('cover') && a!=='cover_backup_1B' && a!=='cover_backup_3B' && a!=='cover2B_or_cut')
  || ['protect_home','popup_priority','stay_near3B','trail_runner_2B','bunt_catcher'].includes(a);
function targets(S){
  const t={}; for(const p of POS) t[p]=target(p,S);
  const fixed=p=>anchored(S.d[p][0]);
  for(let it=0;it<12;it++){
    let moved=false;
    for(let i=0;i<POS.length;i++)for(let j=i+1;j<POS.length;j++){
      const p=POS[i],q=POS[j], v=sub(t[q],t[p]), d=len(v);
      if(d>=GAP) continue;
      moved=true;
      const u=d>.5?unit(v):unit(sub(START[q],START[p])), push=GAP-d;
      const fp=fixed(p), fq=fixed(q);
      if(fp&&!fq) t[q]=add2(t[q],u,push);
      else if(fq&&!fp) t[p]=add2(t[p],u,-push);
      else { t[p]=add2(t[p],u,-push/2); t[q]=add2(t[q],u,push/2); }
    }
    for(const p of POS) t[p]=[Math.max(14,Math.min(386,t[p][0])),Math.max(120,Math.min(410,t[p][1]))];

/* ---------- start-scherm ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={mode:'sit',pos:null,types:new Set(['fly','ground','xbh','tag','pop','bunt']),runs:new Set(['0','1','2','12','3']),len:10};
const runMatch = S => { const k=runKey(S); return k.includes('3')?state.runs.has('3'):state.runs.has(k); };
function renderPosGrid(){
  const g=$('#posGrid');g.innerHTML='';
  for(const p of [...POS,'ALL']){
    const b=document.createElement('button');
    b.className='posbtn'+(p==='ALL'?' all':'')+(state.pos===p?' on':'');
    const s=stats[p];
    b.innerHTML = p==='ALL' ? `<i class="num">1–9</i><div class="pt"><b>${L('Alle posities door elkaar','All positions mixed')}</b><span>${L('Elke vraag een andere positie','A different position every question')}</span></div>`
      : `<i class="num">${NUM[p]}</i><div class="pt"><b>${p}</b><span>${nm(p)}</span></div>${s&&s.t?`<small class="st" title="${L(`${s.c} van ${s.t} goed`,`${s.c} of ${s.t} correct`)}">${Math.round(100*s.c/s.t)}%</small>`:''}`;
    b.onclick=()=>{state.pos=p;renderSetup();};
    g.appendChild(b);
  }
}
function pool(){
  if(state.mode==='theory') return TH.map(T=>({T}));
  const sits=SIT.filter(S=>state.types.has(S.type)&&runMatch(S));
  if(!state.pos) return [];
  const v=S=>S.ov?withOuts(S,Math.random()*3|0):S;
  if(state.pos==='ALL') return sits.flatMap(S=>POS.map(p=>({S:v(S),pos:p})));
  return sits.map(S=>({S:v(S),pos:state.pos}));
}
function renderSetup(){
  const th=state.mode==='theory';
  document.querySelectorAll('#modeSw button').forEach(b=>b.classList.toggle('on',b.dataset.m===state.mode));
  $('#sitOpts').style.display=th?'none':'';
  $('#thNote').style.display=th?'':'none';
  renderPosGrid();
  drawField($('#pickField'),{mode:'pick',me:state.pos==='ALL'?null:state.pos,onPick:p=>{state.mode='sit';state.pos=p;renderSetup();}});
  const n=pool().length;
  $('#startBtn').disabled=!n;
  const s=stats.THEORY;
  $('#startBtn').textContent=th?L('Start de theorie-quiz','Start the theory quiz'):state.pos?(state.pos==='ALL'?L('Start: alle posities','Start: all positions'):L(`Start als ${nm(state.pos).toLowerCase()}`,`Start as ${nm(state.pos).toLowerCase()}`)):L('Kies eerst een positie','Pick a position first');
  $('#poolNote').textContent=th?L(`${n} vragen.`,`${n} questions.`)+(s&&s.t?' '+L(`Tot nu toe ${Math.round(100*s.c/s.t)}% goed.`,`So far ${Math.round(100*s.c/s.t)}% correct.`):'')
    :state.pos?(n?L(`${n} situatie${n===1?'':'s'} beschikbaar met deze filters.`,`${n} situation${n===1?'':'s'} available with these filters.`):L('Geen situaties met deze filters.','No situations with these filters.')):'';
}
document.querySelectorAll('#modeSw button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;renderSetup();});
function chipGroup(sel,set){
  document.querySelectorAll(sel+' .chip').forEach(c=>c.onclick=()=>{
    const v=c.dataset.v;
    if(set.has(v)){if(set.size>1)set.delete(v);}else set.add(v);
    c.classList.toggle('on',set.has(v));renderSetup();
  });
}
chipGroup('#fType',state.types);chipGroup('#fRun',state.runs);
document.querySelectorAll('#fLen .chip').forEach(c=>c.onclick=()=>{state.len=+c.dataset.v;document.querySelectorAll('#fLen .chip').forEach(x=>x.classList.toggle('on',x===c));});

/* ---------- spel ---------- */
let round=null;
const whyFor = (S,p) => {
  if(S.outN!==undefined && p===S.ball) return outsWhy(S,S.outN);
  if(S.ov && S.outN===undefined && p===S.ball) return L('Dit hangt af van het aantal uit. ','This depends on the number of outs. ')+outsSummary(S);
  return S.w&&S.w[p] ? L(S.w[p][0],S.w[p][1]) : A[S.d[p][0]].why(S,p);
};
const srcOf = (S,p) => SRC[S.d[p][2]||S.src];
const tx = a => a[LANG==='en'?1:0];
function startRound(items){
  round={items,i:0,score:0,miss:[],pick:null,kind:items[0]&&items[0].T?'theory':'sit'};
  show('play');nextQ();
}
$('#startBtn').onclick=()=>{
  const p=shuffle(pool());
  // bij "alle posities": niet twee keer achter elkaar dezelfde situatie
  if(state.mode==='sit'&&state.pos==='ALL'){for(let i=1;i<p.length;i++)if((p[i].S.base||p[i].S)===(p[i-1].S.base||p[i-1].S)){const j=p.findIndex((x,k)=>k>i&&x.S!==p[i-1].S);if(j>0)[p[i],p[j]]=[p[j],p[i]];}}
  startRound(p.slice(0,state.len));
};
function nextQ(){
  if(round.i>=round.items.length) return showResult();
  const it=round.items[round.i];
  round.pick=null;
  $('#play .grid2').classList.toggle('solo',!!it.T);
  if(it.T){ round.opts=shuffle([0,1,2,3]); }
  else { round.opts=makeOptions(it.S,it.pos); }
  renderQuestion();
  if(!it.T) drawField($('#playField'),{S:it.S,me:it.pos,mode:'pre'});
  if(window.innerWidth<820) window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuestion(){
  const it=round.items[round.i];
  $('#pCount').textContent=`${round.i+1}/${round.items.length}`;
  $('#pProg').style.width=`${100*(round.i+(round.pick!==null?1:0))/round.items.length}%`;
  $('#pScore').textContent=`✓ ${round.score}`;
  if(it.T){
    $('#pPos').textContent=L('Theorie','Theory');
    $('#sKind').textContent=L('Theorie','Theory');
    $('#sTitle').textContent=tx(it.T.q);
    $('#sRun').textContent='';
    $('#sQ').textContent='';
  } else {
    const {S,pos}=it;
    $('#pPos').textContent=`${L('Jij','You')}: ${pos} · ${nm(pos)}`;
    $('#sKind').textContent=kindTxt(S);
    $('#sTitle').textContent=sitTitle(S);
    $('#sRun').textContent=runTxt(S);
    $('#sQ').textContent=L(`Jij bent ${de(pos)} (${pos}). Wat doe jij?`,`You are ${de(pos)} (${pos}). What do you do?`);
  }
  const o=$('#opts');o.innerHTML='';
  round.opts.forEach((a,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="k">${i+1}</span><span>${esc(it.T?tx(it.T.o[a]):lbl(a))}</span>`;
    b.onclick=()=>answer(i);o.appendChild(b);
  });
  $('#fb').innerHTML='';
  if(round.pick!==null) renderFeedback();
}
function answer(i){
  if(round.pick!==null) return;
  round.pick=i;
  const it=round.items[round.i];
  const good=it.T?round.opts[i]===0:okSet(it.S,it.pos).includes(round.opts[i]);
  if(good) round.score++; else round.miss.push(it);
  const key=it.T?'THEORY':it.pos;
  const st=stats[key]||(stats[key]={c:0,t:0});st.t++;if(good)st.c++;store.save(stats);
  $('#pScore').textContent=`✓ ${round.score}`;
  $('#pProg').style.width=`${100*(round.i+1)/round.items.length}%`;
  renderFeedback();
  if(!it.T) drawField($('#playField'),{S:it.S,me:it.pos,mode:'post'});
  if(window.innerWidth<820) setTimeout(()=>$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function renderFeedback(){
  const it=round.items[round.i];
  const i=round.pick, pick=round.opts[i];
  const correct=it.T?0:it.S.d[it.pos][0], oks=it.T?[0]:okSet(it.S,it.pos), good=oks.includes(pick), alt=good&&pick!==correct&&!it.S.okEq;
  [...$('#opts').children].forEach((b,k)=>{b.disabled=true;const a=round.opts[k];
    if(oks.includes(a))b.classList.add('ok');else if(k===i)b.classList.add('no');else b.classList.add('fade');});
  const last=round.i+1>=round.items.length;
  const head=`<h3>${alt?L('Goed, kan ook','Correct, that works'):good?L('Goed!','Correct!'):L('Niet helemaal','Not quite')}</h3>`;
  const next=`<div class="next"><button class="btn pri" id="nextBtn">${last?L('Bekijk resultaat','See result'):L(it.T?'Volgende vraag':'Volgende situatie',it.T?'Next question':'Next situation')} →</button></div>`;
  if(it.T){
    $('#fb').innerHTML=`<div class="fb ${good?'ok':'no'}">${head}
      <p><b>${L('Antwoord:','Answer:')}</b> ${esc(tx(it.T.o[0]))}.</p>
      <p>${esc(tx(it.T.why))}</p>
      <p class="srcl">${L('Bron','Source')}: ${esc(SRC[it.T.src])}</p></div>${next}`;
  } else {
    const {S,pos}=it;
    $('#fb').innerHTML=`
    <div class="fb ${good?'ok':'no'}">${head}
      ${good?'':`<p><b>${L('Jij koos:','You chose:')}</b> ${esc(lbl(pick).toLowerCase())}. ${esc(wrongWhy(S,pos,pick))}</p>`}
      ${alt?`<p>${esc(L(`Jouw keuze kan ook met ${OUTS(S.outN)}. De beste keuze is:`,`Your choice also works with ${OUTS(S.outN)}. The best choice is:`))} <b>${esc(lbl(correct).toLowerCase())}</b>.</p>`
           :`<p><b>${L(`Jouw taak als ${nm(pos).toLowerCase()}:`,`Your job as ${nm(pos).toLowerCase()}:`)}</b> ${esc(lbl(good?pick:correct).toLowerCase())}.</p>`}
      ${oks.length>1&&!alt&&good?`<p>${esc(L('Ook goed: ','Also fine: ')+oks.filter(a=>a!==pick).map(a=>lbl(a).toLowerCase()).join(L(' of ',' or ')))}.</p>`:''}
      ${oks.length>1&&!good?`<p>${esc(L('Ook goed: ','Also fine: ')+oks.filter(a=>a!==correct).map(a=>lbl(a).toLowerCase()).join(L(' of ',' or ')))}.</p>`:''}
      <p>${esc(whyFor(S,pos))}</p>
      ${S.d[pos][1]?`<p class="quote">${L('Bron','Source')} (${esc(srcOf(S,pos))}): “${esc(S.d[pos][1])}”</p>`:`<p class="srcl">${L('Bron','Source')}: ${esc(srcOf(S,pos))}</p>`}
      <div class="idea"><b>${L('Het idee van deze situatie:','The idea of this situation:')}</b> ${esc(idea(S))}</div>
      <details><summary>${L('Wie doet wat?','Who does what?')}</summary>${whoList(S,pos)}</details>
    </div>${next}`;
  }
  $('#nextBtn').onclick=()=>{round.i++;nextQ();};
}
function whoList(S,me){
  return `<ul class="who">${POS.map(p=>`<li class="${p===me?'me':''}"><b>${p}</b><span>${esc(lbl(S.d[p][0]))}</span></li>`).join('')}</ul>`;
}
document.addEventListener('keydown',e=>{
  if(!$('#play').classList.contains('on')||!round) return;
  if(round.pick===null && /^[1-4]$/.test(e.key)) answer(+e.key-1);
  else if(round.pick!==null && (e.key==='Enter'||e.key===' ')){e.preventDefault();$('#nextBtn')?.click();}
});
$('#stopBtn').onclick=()=>{ if(round.i>0||round.pick!==null){round.items=round.items.slice(0,round.i+(round.pick!==null?1:0));showResult();} else show('setup'); };

function showResult(){ show('result'); renderResult(); }
function renderResult(){
  const n=round.items.length,s=round.score,pct=n?s/n:0;
  $('#rPos').textContent=round.kind==='theory'?L('Theorie','Theory'):state.pos==='ALL'?L('Alle posities','All positions'):`${state.pos} · ${PN[state.pos]?nm(state.pos):''}`;
  $('#rScore').textContent=`${s}/${n}`;
  $('#rMsg').textContent=pct===1?L('Foutloos! Jij weet precies waar je moet staan. ⚾','Perfect! You know exactly where to be. ⚾')
    :pct>=.8?L('Sterk gedaan! Nog een paar details en je hebt het helemaal.','Great job! A few details and you\'ve got it all.')
    :pct>=.5?L('Op de goede weg. Kijk de fouten nog eens rustig na.','On the right track. Take another look at your mistakes.')
    :L('Lastig hè? Bekijk de uitleg hieronder en probeer de fouten opnieuw.','Tricky, right? Check the explanations below and retry your mistakes.');
  $('#rMiss').innerHTML=round.miss.length?`<div class="lbl">${L('Nog even oefenen','Keep practising')}</div><ul class="miss">${round.miss.map(it=>it.T
    ?`<li><div class="t">${esc(tx(it.T.q))}</div>${esc(tx(it.T.o[0]))}</li>`
    :`<li><div class="t">${it.pos} · ${esc(sitTitle(it.S))}, ${esc(runTxt(it.S).toLowerCase())}</div>${esc(lbl(it.S.d[it.pos][0]))}</li>`).join('')}</ul>`:'';
  $('#retryMiss').style.display=round.miss.length?'':'none';
}
$('#retryMiss').onclick=()=>startRound(shuffle(round.miss));
$('#again').onclick=()=>$('#startBtn').click();
$('#toSetup').onclick=()=>show('setup');

/* ---------- studeren ---------- */
const study={S:SIT[0],pos:null};
const RUNSHORT={'0':['leeg','empty'],'1':['1','1'],'2':['2','2'],'12':['1+2','1+2'],'3':['3','3'],'13':['1+3','1+3']};
const shortName = S => S.type==='xbh'?{LFline:'LF-lijn',LCgap:'LC',RCgap:'RC',RFline:'RF-lijn'}[S.where].replace('lijn',L('lijn','line'))
  : S.type==='bunt'?(S.to==='H'?'squeeze':'bunt'):S.ball;
function renderStudyList(){
  $('#slist').innerHTML=Object.keys(KIND).map(t=>`<div class="sgroup"><h3>${tx(KIND[t])}</h3><div class="sitems">${
    SIT.filter(S=>S.type===t).map(S=>`<button class="sitem${S===study.S?' on':''}" data-id="${S.id}">${shortName(S)} · ${tx(RUNSHORT[runKey(S)])}</button>`).join('')}</div></div>`).join('');
  $('#slist').querySelectorAll('.sitem').forEach(b=>b.onclick=()=>{study.S=SIT[+b.dataset.id];renderStudy();
    if(window.innerWidth<820)$('#studyField').scrollIntoView({behavior:'smooth',block:'start'});});
}
function renderStudy(animate=true){
  renderStudyList();
  const S=study.S;
  $('#tKind').textContent=kindTxt(S);
  $('#tTitle').textContent=sitTitle(S);
  $('#tRun').textContent=runTxt(S);
  $('#tIdea').innerHTML=`<b>${L('Het idee:','The idea:')}</b> ${esc(idea(S))}<div class="srcl">${L('Bron','Source')}: ${esc(SRC[S.src])}</div>`;
  $('#tWho').innerHTML=POS.map(p=>`<li data-pos="${p}" class="${p===study.pos?'me':''}"><div class="h"><b>${p}</b><span>${esc(lbl(S.d[p][0]))}</span></div><div class="why">${esc(whyFor(S,p))}<br><span class="quote">“${esc(S.d[p][1])}”</span></div></li>`).join('');
  $('#tWho').querySelectorAll('li').forEach(li=>li.onclick=()=>{study.pos=study.pos===li.dataset.pos?null:li.dataset.pos;renderStudy(false);});
  drawField($('#studyField'),{S,me:study.pos,mode:'post',animate});
}
$('#replay').onclick=()=>renderStudy(true);

/* ---------- navigatie & taal ---------- */
let current='setup';
function show(id){
  current=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  const tab=id==='study'?'study':'setup';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  if(id==='setup'){stats=store.get();renderSetup();}
  if(id==='study') renderStudy();
  window.scrollTo(0,0);
}
function setLang(l){
  LANG=l; try{localStorage.setItem('bbsit-lang',l);}catch(e){}
  applyStatic();
  if(current==='setup') renderSetup();
  else if(current==='study') renderStudy(false);
  else if(current==='result') renderResult();
  else if(current==='play'){
    const it=round.items[round.i];
    renderQuestion();
    if(!it.T) drawField($('#playField'),{S:it.S,me:it.pos,mode:round.pick!==null?'post':'pre',animate:false});
  }
}
document.querySelectorAll('.langtg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#home').onclick=()=>show('setup');
applyStatic();
renderSetup();
</script>
</body>
</html>
