<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honkbal Situaties</title>
<meta name="theme-color" content="#1d3a2c">
<style>
:root{
  --bg:#f3f0e8; --card:#ffffff; --ink:#1b2620; --muted:#5d6b64; --line:#e2ddd2;
  --accent:#b3132b; --accent-ink:#fff; --accent-soft:#f8e3e6;
  --good:#1d7f47; --good-bg:#e3f4e9; --bad:#c0392b; --bad-bg:#fbe9e7;
  --me:#ffc531; --pl:#1d3557; --chip:#ece8de; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --field-out:#24563a; --grass:#3f8a4e; --grass2:#3a8148; --dirt:#c08a57;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101613; --card:#1a221e; --ink:#e7eee9; --muted:#9db0a5; --line:#2b3732;
    --accent:#e0485f; --accent-ink:#fff; --accent-soft:#3a1d23;
    --good:#4cc47e; --good-bg:#15301f; --bad:#ff7a6b; --bad-bg:#3a1c1a;
    --chip:#24302a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --field-out:#183d29;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.hwrap{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo span{white-space:nowrap}
@media (max-width:420px){.logo{font-size:16px}nav button{padding:6px 11px}}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.logo svg{width:28px;height:28px}
nav{margin-left:auto;display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:999px}
nav button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.on{display:block}
h1{font-size:26px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* veld */
.field{width:100%;height:auto;display:block;border-radius:14px;background:var(--field-out);touch-action:manipulation}
.fieldbox{position:relative}
.pl{transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.pl circle.body{fill:var(--pl);stroke:#fff;stroke-width:1.6}
.pl text{fill:#fff;font:700 8.4px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl.me circle.body{fill:var(--me);stroke:#3a2a00}
.pl.me text{fill:#2a1f00}
.pl.dim{opacity:.55}
.pl .ring{fill:none;stroke:var(--me);stroke-width:2;opacity:.9;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.pick .pl{cursor:pointer}
.pick .pl:hover circle.body{stroke:var(--me);stroke-width:2.4}
.mv{fill:none;stroke:#111;stroke-width:1.5;opacity:0;transition:opacity .5s .5s}
.mv.me{stroke:var(--me);stroke-width:2.4}
.show .mv{opacity:.85}
.hit{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:5 3;opacity:.85}
.hit.fly{stroke-width:1.8;stroke-dasharray:.1 4;stroke-linecap:round}
.throw{fill:none;stroke:#ff3b3b;stroke-width:2.3;stroke-dasharray:4 3}
.tag{font:800 7px system-ui,sans-serif;fill:#2a1f00;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.l{width:16px;height:0;border-top:2px dashed #ff3b3b;border-radius:0;vertical-align:3px}
.legend i.a{width:16px;height:0;border-top:2px solid #111;border-radius:0;vertical-align:3px}
@media (prefers-color-scheme: dark){.legend i.a{border-color:#ddd}}

/* setup */
.posgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.posbtn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:58px}
.posbtn b{font-size:15px}
.posbtn span{font-size:12px;color:var(--muted)}
.posbtn small{font-size:11px;color:var(--muted);font-weight:600}
.posbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.posbtn.all{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--chip)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 8px}
.big{display:block;width:100%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;padding:14px;border-radius:14px;cursor:pointer;margin-top:18px}
.big:disabled{opacity:.45;cursor:not-allowed}
.btn{border:1.5px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* spelen */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.pill.me{background:var(--me);color:#2a1f00}
.prog{flex:1;min-width:80px;height:6px;background:var(--chip);border-radius:9px;overflow:hidden}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.stop{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13.5px;cursor:pointer;text-decoration:underline}
.sit .kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sit h1{margin:2px 0 4px}
.sit .run{color:var(--muted);font-weight:600}
.q{font-weight:700;font-size:17px;margin:14px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;font-size:15.5px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);color:#fff}
.opt.fade{opacity:.5}
.fb{margin-top:14px;border-radius:14px;padding:14px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:18px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.fb p{margin:6px 0}
.fb .idea{border-top:1px solid rgba(127,127,127,.25);margin-top:10px;padding-top:8px;font-size:14.5px}
.quote{font-size:13.5px;color:var(--muted);font-style:italic}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14.5px}
.who{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.who li{display:flex;gap:8px;font-size:14px;align-items:flex-start;padding:4px 6px;border-radius:8px}
.who li.me{background:rgba(255,197,49,.25)}
.who li b{flex:none;width:30px;height:22px;border-radius:6px;background:var(--pl);color:#fff;font-size:11.5px;display:grid;place-items:center}
.who li.me b{background:var(--me);color:#2a1f00}
.next{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.kbd{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}
@media (hover:none){.kbd{display:none}}

/* resultaat */
.score{font-size:56px;font-weight:900;letter-spacing:-.03em;line-height:1}
.miss{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.miss li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.miss li .t{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* studeren */
.slist{display:flex;flex-direction:column;gap:14px}
.sgroup h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.sitems{display:flex;flex-wrap:wrap;gap:6px}
.sitem{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
.sitem.on{border-color:var(--accent);background:var(--accent-soft)}
.who.study li{cursor:pointer;flex-direction:column;gap:2px;padding:7px 8px;border:1px solid transparent}
.who.study li .h{display:flex;gap:8px;align-items:flex-start}
.who.study li .why{display:none;font-size:13.5px;color:var(--muted);margin-left:38px}
.who.study li.me .why{display:block}
.who.study li:hover{border-color:var(--line)}
.stickyfield{position:sticky;top:70px}
@media (max-width:820px){.stickyfield{position:static}#play .field{max-height:36vh}#play .card.fieldbox{padding:10px}#play .legend{font-size:11.5px;margin-top:6px}}
@media (prefers-reduced-motion: reduce){.pl,.mv{transition:none!important}.pl .ring{animation:none}}
.langtg{display:flex;background:var(--chip);padding:3px;border-radius:999px;margin-left:6px}
.langtg button{border:0;background:none;padding:6px 9px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}
.langtg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:420px){.hwrap{gap:8px}.logo span{display:none}.langtg button{padding:6px 7px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <button class="logo" id="home" data-i18n-aria="toStart">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff" stroke="#c9c2b3" stroke-width="1.5"/><path d="M9 5.5c3.2 3 4.8 6.6 4.8 10.5S12.2 23.5 9 26.5M23 5.5c-3.2 3-4.8 6.6-4.8 10.5s1.6 7.5 4.8 10.5" fill="none" stroke="#b3132b" stroke-width="1.6" stroke-dasharray="2 1.6"/></svg>
      <span data-i18n="appName"></span>
    </button>
    <nav>
      <button data-go="setup" class="on" data-i18n="tabPlay"></button>
      <button data-go="study" data-i18n="tabStudy"></button>
    </nav>
    <div class="langtg" role="group" aria-label="Taal / Language">
      <button data-lang="nl">NL</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- START -->
  <section class="screen on" id="setup">
    <div class="grid2">
      <div>
        <h1 data-i18n="setupTitle"></h1>
        <p class="sub" data-i18n="setupSub"></p>
        <div class="card fieldbox">
          <svg class="field pick" id="pickField" viewBox="0 105 400 312" role="img"></svg>
          <div class="note" data-i18n="pickNote"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="lbl" style="margin-top:0" data-i18n="lblPos"></div>
          <div class="posgrid" id="posGrid"></div>
          <div class="lbl" data-i18n="lblType"></div>
          <div class="chips" id="fType">
            <button class="chip on" data-v="fly" data-i18n="chipFly"></button>
            <button class="chip on" data-v="ground" data-i18n="chipGround"></button>
          </div>
          <div class="lbl" data-i18n="lblRun"></div>
          <div class="chips" id="fRun">
            <button class="chip on" data-v="0" data-i18n="chipR0"></button>
            <button class="chip on" data-v="1" data-i18n="chipR1"></button>
            <button class="chip on" data-v="2" data-i18n="chipR2"></button>
            <button class="chip on" data-v="12" data-i18n="chipR12"></button>
          </div>
          <div class="lbl" data-i18n="lblLen"></div>
          <div class="chips" id="fLen">
            <button class="chip" data-v="5">5</button>
            <button class="chip on" data-v="10">10</button>
            <button class="chip" data-v="20">20</button>
            <button class="chip" data-v="999" data-i18n="chipAll"></button>
          </div>
          <button class="big" id="startBtn"></button>
          <div class="note" id="poolNote"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SPELEN -->
  <section class="screen" id="play">
    <div class="bar">
      <span class="pill me" id="pPos"></span>
      <span class="pill" id="pCount"></span>
      <div class="prog"><div id="pProg"></div></div>
      <span class="pill" id="pScore"></span>
      <button class="stop" id="stopBtn" data-i18n="stop"></button>
    </div>
    <div class="grid2">
      <div class="stickyfield">
        <div class="card fieldbox">
          <svg class="field" id="playField" viewBox="0 105 400 312" role="img"></svg>
          <div class="legend"><span><i style="background:var(--me)"></i><span data-i18n="lgYou"></span></span><span><i style="background:#e4572e"></i><span data-i18n="lgRunner"></span></span><span><i style="background:#fff;border:1px solid #999"></i><span data-i18n="lgBall"></span></span><span><i class="a"></i><span data-i18n="lgMove"></span></span><span><i class="l"></i><span data-i18n="lgThrow"></span></span></div>
        </div>
      </div>
      <div>
        <div class="card sit">
          <div class="kind" id="sKind"></div>
          <h1 id="sTitle"></h1>
          <div class="run" id="sRun"></div>
          <div class="q" id="sQ"></div>
          <div class="opts" id="opts"></div>
          <div id="fb"></div>
          <div class="kbd" data-i18n="kbd"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- RESULTAAT -->
  <section class="screen" id="result">
    <div class="card" style="max-width:720px;margin:0 auto">
      <div class="lbl" style="margin-top:0" id="rPos"></div>
      <div class="score" id="rScore"></div>
      <p id="rMsg" style="font-size:17px;margin:8px 0 0"></p>
      <div id="rMiss"></div>
      <div class="row">
        <button class="btn pri" id="retryMiss" data-i18n="retryMiss"></button>
        <button class="btn" id="again" data-i18n="again"></button>
        <button class="btn" id="toSetup" data-i18n="toSetup"></button>
      </div>
    </div>
  </section>

  <!-- STUDEREN -->
  <section class="screen" id="study">
    <h1 data-i18n="studyTitle"></h1>
    <p class="sub" data-i18n="studySub"></p>
    <div class="grid2">
      <div class="stickyfield">
        <div class="card fieldbox">
          <svg class="field" id="studyField" viewBox="0 105 400 312" role="img"></svg>
          <div class="legend"><span><i style="background:var(--me)"></i><span data-i18n="lgChosen"></span></span><span><i style="background:#e4572e"></i><span data-i18n="lgRunner"></span></span><span><i class="a"></i><span data-i18n="lgMove"></span></span><span><i class="l"></i><span data-i18n="lgThrow"></span></span></div>
          <div class="row" style="margin-top:10px"><button class="btn" id="replay" data-i18n="replay"></button></div>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:14px"><div class="slist" id="slist"></div></div>
        <div class="card sit">
          <div class="kind" id="tKind"></div>
          <h1 id="tTitle" style="font-size:22px"></h1>
          <div class="run" id="tRun"></div>
          <p id="tIdea" style="margin:10px 0 0;font-size:15px"></p>
          <ul class="who study" id="tWho"></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
/* ---------- taal ---------- */
let LANG = (()=>{try{const s=localStorage.getItem('bbsit-lang');if(s==='nl'||s==='en')return s;}catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('nl')?'nl':'en';})();
const L = (nl,en) => LANG==='en'?en:nl;

const UI = {
  appName:['Honkbal Situaties','Baseball Situations'], toStart:['Naar start','Back to start'],
  tabPlay:['Spelen','Play'], tabStudy:['Studeren','Study'],
  setupTitle:['Welke positie speel jij?','Which position do you play?'],
  setupSub:['Je krijgt een spelsituatie te zien. Kies wat jij op jouw positie doet. Na elke keuze legt de gids uit waarom die goed of fout is.',
            'You get a game situation. Choose what you do at your position. After every answer the guide explains why it is right or wrong.'],
  pickNote:['Tik op een speler in het veld of kies een positie uit de lijst.','Tap a player on the field or pick a position from the list.'],
  lblPos:['Positie','Position'], lblType:['Soort slag','Type of hit'], lblRun:['Lopers op de honken','Runners on base'], lblLen:['Aantal vragen','Number of questions'],
  chipFly:['Fly balls','Fly balls'], chipGround:['Grondballen','Ground balls'],
  chipR0:['Geen','None'], chipR1:['Op 1','On 1st'], chipR2:['Op 2','On 2nd'], chipR12:['Op 1 en 2','On 1st & 2nd'], chipAll:['Alles','All'],
  stop:['Stoppen','Stop'], lgYou:['Jij','You'], lgRunner:['Loper','Runner'], lgBall:['Bal','Ball'], lgMove:['Looprichting','Movement'], lgThrow:['Worp','Throw'],
  lgChosen:['Gekozen positie','Selected position'],
  kbd:['Toetsen 1–4 om te kiezen · Enter voor volgende','Keys 1–4 to answer · Enter for next'],
  retryMiss:['Fouten opnieuw','Retry mistakes'], again:['Nieuwe ronde','New round'], toSetup:['Andere positie','Other position'],
  studyTitle:['Situaties bestuderen','Study the situations'],
  studySub:['Kies een situatie en zie wat iedere positie doet. Tik op een positie voor de uitleg.','Pick a situation and see what every position does. Tap a position for the explanation.'],
  replay:['↻ Opnieuw afspelen','↻ Replay'],
};
const u = k => UI[k][LANG==='en'?1:0];
function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=u('appName');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=u(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',u(e.dataset.i18nAria)));
  document.querySelectorAll('.langtg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
}

/* ---------- basis ---------- */
const POS = ['P','C','1B','2B','SS','3B','LF','CF','RF'];
const PN = {
  P:[['Werper','de werper'],['Pitcher','the pitcher']], C:[['Catcher','de catcher'],['Catcher','the catcher']],
  '1B':[['Eerste honkman','de eerste honkman'],['First baseman','the first baseman']], '2B':[['Tweede honkman','de tweede honkman'],['Second baseman','the second baseman']],
  SS:[['Korte stop','de korte stop'],['Shortstop','the shortstop']], '3B':[['Derde honkman','de derde honkman'],['Third baseman','the third baseman']],
  LF:[['Linksvelder','de linksvelder'],['Left fielder','the left fielder']], CF:[['Midvelder','de midvelder'],['Center fielder','the center fielder']],
  RF:[['Rechtsvelder','de rechtsvelder'],['Right fielder','the right fielder']]
};
const nm = p => PN[p][LANG==='en'?1:0][0];
const de = p => PN[p][LANG==='en'?1:0][1];
const BNS = {'1B':['het eerste honk','first base'],'2B':['het tweede honk','second base'],'3B':['het derde honk','third base'],H:['de thuisplaat','home plate']};
const BN = b => BNS[b][LANG==='en'?1:0];
const AREA = {LF:['het linksveld','left field'],CF:['het midveld','center field'],RF:['het rechtsveld','right field']};
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const runKey = S => S.run.join('') || '0';
const RUNTXT = {'0':['Geen lopers op de honken','No runners on base'],'1':['Loper op het eerste honk','Runner on first base'],'2':['Loper op het tweede honk','Runner on second base'],'12':['Lopers op het eerste en tweede honk','Runners on first and second base']};
const runTxt = S => RUNTXT[runKey(S)][LANG==='en'?1:0];

/* ---------- het idee achter een situatie ---------- */
function idea(S){
  const k = runKey(S);
  if(S.type==='fly'){
    if(k==='0') return L('Geen lopers: alleen de slagman loopt. De bal moet zo snel mogelijk naar het tweede honk, zodat de slagman niet verder komt dan het eerste honk.',
                         'No runners: only the batter is running. The ball has to get to second base as fast as possible, so the batter stops at first.');
    if(k==='1') return L('De loper op het eerste honk probeert bij een slag naar het outfield door te lopen naar het derde honk. Daarom gaat de worp naar het derde honk.',
                         'On a hit to the outfield, the runner on first tries to go all the way to third. That is why the throw goes to third base.');
    return L('De loper op het tweede honk probeert te scoren. Daarom gaat de worp naar de thuisplaat.','The runner on second tries to score. That is why the throw goes home.');
  }
  if(k==='0') return L('Geen lopers: de enige uit die je kunt maken is de slagman op het eerste honk.','No runners: the only out you can get is the batter at first base.');
  if(k==='1') return L('De loper op het eerste honk moet doorlopen (gedwongen). Je pakt de voorste loper: force out op het tweede honk, en misschien lukt nog een dubbelspel.',
                       'The runner on first is forced to run. Get the lead runner: force out at second base, and maybe turn a double play.');
  if(k==='2') return L('De loper op het tweede honk is níet gedwongen om te lopen. Kijk hem eerst terug zodat hij blijft staan, en maak dan de zekere uit op het eerste honk.',
                       'The runner on second is NOT forced to run. Look him back first so he stays put, then take the sure out at first base.');
  if(S.ball==='1B') return L('Beide lopers zijn gedwongen, maar de eerste honkman staat ver van het derde honk. Hij neemt de zekere uit op het eerste honk en houdt de loper richting het derde honk in de gaten.',
                             'Both runners are forced, but the first baseman is far from third base. He takes the sure out at first and keeps an eye on the runner heading to third.');
  if(S.ball==='3B') return L('Beide lopers zijn gedwongen. Pak de voorste loper: de derde honkman staat er zelf het dichtst bij en tikt de loper uit of stapt op het honk.',
                             'Both runners are forced. Get the lead runner: the third baseman is closest, so he tags the runner or steps on the bag.');
  return L('Beide lopers zijn gedwongen. Pak de voorste loper: force out op het derde honk.','Both runners are forced. Get the lead runner: force out at third base.');
}
const cutPos = S => POS.find(p=>['cutoff','cover2B_or_cut'].includes(S.d[p][0]));

const backupBaseWhy = base => (S)=>L(
  `${S.to===base?`De worp gaat naar ${BN(base)}.`:`Er kan ook een worp naar ${BN(base)} komen.`} Jij gaat erachter staan, in lijn met de worp. Gaat de bal mis (overthrow), dan stop jij hem en krijgen de lopers geen extra honk.`,
  `${S.to===base?`The throw goes to ${BN(base)}.`:`A throw could also go to ${BN(base)}.`} You get behind it, in line with the throw. If the ball gets away (overthrow), you stop it and the runners don't get an extra base.`);

const throwOut = base => ({l:()=>L(`Hard naar ${BN(base)} gooien, of naar de cut-off als het te ver is`,`Throw hard to ${BN(base)}, or hit the cut-off if it's too far`),g:['o'+base],field:base,
  why:S=>L(`Jij haalt de bal op. ${idea(S)} Gooi hard en laag naar ${BN(base)}. Is het te ver, gooi dan naar de cut-off (${de(cutPos(S))}) die in lijn tussen jou en het honk staat.`,
           `You get the ball. ${idea(S)} Throw hard and low to ${BN(base)}. If it's too far, hit the cut-off (${de(cutPos(S))}) who lines up between you and the base.`)});

  cover1B:{l:()=>L('Het eerste honk dekken','Cover first base'),g:['c1'],why:(S,pos)=>{

const lbl = a => A[a].l();

/* welke foute opties passen bij een positie */
const POOL = {
  P:['cover1B','cover3B','cover_home','cover2B','backup_1B','backup_3B','backup_2B','p_backup_mound_2B','p_backup_mound_SS','p_backup_3B_home','p_backup_1B_home','field_1B','field_2B','field_3B','hold_throw1B','cutoff','cover_backup_1B','cover_backup_3B'],
  C:['protect_home','follow_runner_1B','backup_1B','cover3B','backup_3B','cover1B','backup_P','cover_home'],
  '1B':['cover1B','cover1B_after_touch','field_run1B','field_1B','field_2B','field_3B','hold_throw1B','cutoff','cover2B','backup_P','backup_2B'],
  '2B':['cover2B','cover2B_or_cut','cutoff','field_1B','field_2B','field_3B','hold_throw1B','backup_1B','backup_P','cover1B','backup_SS'],
  SS:['cover2B','cover2B_or_cut','cutoff','field_1B','field_2B','field_3B','hold_throw1B','backup_3B','cover3B','backup_2B','backup_P'],
  '3B':['cover3B','stay_near3B','backup_SS','field_1B','field_2B','field_3B','field_tag3','hold_throw1B','cutoff','cover_home','cover2B'],
  LF:['backup_3B','backup_SS','backup_CF','backup_2B','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','cutoff','rf_toward_infield','cover3B'],
  CF:['backup_2B','backup_LF','backup_RF','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','cutoff','cover2B','rf_toward_infield'],
  RF:['backup_1B','backup_2B','backup_CF','throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','cutoff','rf_toward_infield','cover1B'],
};
const SELF = {P:'backup_P','1B':'backup_1B','2B':'backup_2B',SS:'backup_SS','3B':'backup_3B',LF:'backup_LF',CF:'backup_CF',RF:'backup_RF'};
const OUT_ONLY = ['throw_2B_or_cut','throw_3B_or_cut','throw_home_or_cut','rf_toward_infield'];
const conflicts = (a,b) => a===b || A[a].g.some(x=>A[b].g.includes(x));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function makeOptions(S,pos){
  const correct = S.d[pos][0];
  const isOF = ['LF','CF','RF'].includes(pos);
  const ok = a => a!==SELF[pos] && (isOF || !OUT_ONLY.includes(a)) && !(pos==='C' && A[a].field) && !chosen.some(c=>conflicts(a,c));
  const chosen = [correct];
  const add = (list,cap=4) => {let n=0;for(const a of shuffle(list)){if(chosen.length>=4||n>=cap)break;if(ok(a)){chosen.push(a);n++;}}};
  const same = [...new Set(POS.filter(p=>p!==pos).map(p=>S.d[p][0]))];
  add(same.filter(a=>POOL[pos].includes(a)),2);
  add(POOL[pos]);
  add(same);
  add(Object.keys(A));
  return shuffle(chosen);
}

const listPos = ps => { const n=ps.map(de); return n.length===1?n[0]:n.slice(0,-1).join(', ')+L(' en ',' and ')+n[n.length-1]; };
function wrongWhy(S,pos,act){
  const parts=[];
  const who = POS.filter(p=>p!==pos && conflicts(S.d[p][0],act));
  const a = A[act];
  if(a.field && S.ball!==pos) parts.push(L(`De bal gaat niet naar jou, maar naar ${de(S.ball)}.`,`The ball isn't coming to you, it goes to ${de(S.ball)}.`));
  else if(a.field && S.ball===pos) parts.push(a.field===S.to
    ? L(`De bal is wel voor jou, maar je moet het anders aanpakken. ${idea(S)}`,`The ball is yours, but you should handle it differently. ${idea(S)}`)
    : L(`De bal is wel voor jou, maar de worp hoort niet naar ${BN(a.field)} te gaan. ${idea(S)}`,`The ball is yours, but the throw shouldn't go to ${BN(a.field)}. ${idea(S)}`));
  if(a.field && who.length===1 && who[0]===S.ball) {}
  else if(who.length) parts.push(L(`Dat is in deze situatie de taak van ${listPos(who)}.`,`In this situation that is the job of ${listPos(who)}.`)
    +(a.field?'':L(' Doe jij het ook, dan staan jullie dubbel en blijft jouw eigen taak liggen.',' If you do it too, two players end up doing the same thing and your own job is left undone.')));
  else if(!a.field) parts.push(a.no ? a.no(S,pos) : L('Daar is in deze situatie niemand nodig: de bal en de worp gaan een andere kant op.','Nobody is needed there in this situation: the ball and the throw go elsewhere.'));
  return parts.join(' ');
}

/* ---------- veld tekenen ---------- */
const NS='http://www.w3.org/2000/svg';
const H=[200,385], B={'1B':[266,319],'2B':[200,253],'3B':[134,319],H:[200,385]};
const START={P:[200,326],C:[200,402],'1B':[279,293],'2B':[240,247],SS:[160,247],'3B':[121,293],LF:[92,196],CF:[200,158],RF:[308,196]};
const SPOT_FLY={LF:[84,176],CF:[200,138],RF:[316,176]};
const SPOT_GR={'3B':[127,301],SS:[166,262],'2B':[234,262],'1B':[273,303],P:[207,349]};
const spot = S => S.type==='fly'?SPOT_FLY[S.ball]:SPOT_GR[S.ball];
const add2=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const len=v=>Math.hypot(v[0],v[1]);
const unit=v=>{const l=len(v)||1;return [v[0]/l,v[1]/l];};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const DEF={'1B':[.85,.55],'2B':[0,-1],'3B':[-.85,.55],H:[0,1]};
function behindBase(base,S){const b=B[base];const v=sub(b,spot(S));return add2(b,len(v)<40?unit(DEF[base]):unit(v),30);}
function behind(p){return add2(p,unit(sub(p,H)),30);}

function target(pos,S){
  const act=S.d[pos][0], sp=spot(S), st=START[pos];
  if(A[act].field) return sp;
  switch(act){
    case 'cover1B': case 'cover1B_after_touch': case 'cover_backup_1B': return add2(B['1B'],[3,-8]);
    case 'cover2B': return add2(B['2B'],[pos==='SS'?-6:6,-5]);
    case 'cover3B': case 'stay_near3B': return add2(B['3B'],[-3,-8]);
    case 'cover_backup_3B': return [140,334];
    case 'cover_home': return [190,377];
    case 'protect_home': return [200,393];
    case 'follow_runner_1B': return [276,355];
    case 'cutoff': return lerp(B[S.to],sp,.45);
    case 'cover2B_or_cut': return add2(lerp(B['2B'],sp,.22),[pos==='2B'?12:-12,0]);
    case 'backup_1B': return (S.type==='ground'&&S.ball==='1B')?add2(B['1B'],unit(DEF['1B']),30):behindBase('1B',S);
    case 'backup_2B': return behindBase('2B',S);
    case 'backup_3B': return (S.type==='ground'&&S.ball==='3B')?behind(sp):behindBase('3B',S);
    case 'backup_SS': return S.ball==='SS'?behind(sp):behind(START.SS);
    case 'backup_P': return add2(sp,[8,-28]);
    case 'backup_LF': case 'backup_CF': case 'backup_RF': {
      const o=SPOT_FLY[act.slice(-2)]; return add2(add2(o,unit(sub(o,H)),22),unit(sub(st,o)),24);}
    case 'p_backup_mound_2B': return [200,287];
    case 'p_backup_mound_SS': return [181,289];
    case 'p_backup_3B_home': return [152,360];
    case 'p_backup_1B_home': return [248,360];
    case 'rf_toward_infield': return add2(st,unit(sub(B['2B'],st)),45);
  }
  return st;
}
/* alle doelen, met spelers die op dezelfde plek uitkomen iets uit elkaar */
function targets(S){
  const t={};
  for(const p of POS){
    let tg=target(p,S);
    for(const q in t){
      if(len(sub(tg,t[q]))<18){
        const u=unit(sub(tg,START[p]).map(v=>v||1e-3));
        const side=[ -u[1], u[0] ];
        t[q]=add2(t[q],side,-11); tg=add2(tg,side,11);
      }
    }
    t[p]=tg;
  }
  return t;
}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let fieldUid=0;
function drawBase(svg){
  svg.innerHTML='';
  const id='f'+(++fieldUid);
  const defs=el('defs',{},svg);
  const wedge=`M200,385 L9.1,194.1 A270,270 0 0,1 390.9,194.1 Z`;
  const cp=el('clipPath',{id:id+'c'},defs); el('path',{d:wedge},cp);
  for(const [n,c] of [['k','#111'],['m','#ffc531'],['r','#ff3b3b']]){
    const m=el('marker',{id:id+n,viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',fill:c},m);
  }
  el('rect',{x:0,y:100,width:400,height:320,fill:'var(--field-out)'},svg);
  el('path',{d:wedge,fill:'var(--grass)'},svg);
  const st=el('g',{'clip-path':`url(#${id}c)`},svg);
  for(let i=-8;i<9;i++) if(i%2) el('rect',{x:200+i*24-12,y:100,width:24,height:300,fill:'var(--grass2)'},st);
  el('path',{d:'M200,385 L110,295 A94,94 0 0,1 290,295 Z',fill:'var(--dirt)'},st);
  el('path',{d:'M200,372 L253,319 L200,266 L147,319 Z',fill:'var(--grass)'},svg);
  el('circle',{cx:200,cy:326,r:9,fill:'var(--dirt)'},svg);
  el('rect',{x:196,y:325,width:8,height:2,fill:'#fff'},svg);
  el('circle',{cx:200,cy:385,r:15,fill:'var(--dirt)'},svg);
  el('path',{d:'M200,385 L9.1,194.1 M200,385 L390.9,194.1',stroke:'#fff','stroke-width':1.4},svg);
  el('path',{d:wedge,fill:'none',stroke:'#1a3f2a','stroke-width':4},svg);
  for(const b of ['1B','2B','3B']) el('rect',{x:B[b][0]-4,y:B[b][1]-4,width:8,height:8,fill:'#fff',transform:`rotate(45 ${B[b][0]} ${B[b][1]})`},svg);
  el('path',{d:'M195,382 h10 v4 l-5,4 l-5,-4z',fill:'#fff'},svg);
  return id;
}
function player(svg,pos,xy,cls){
  const g=el('g',{class:'pl '+(cls||''),'data-pos':pos},svg);
  g.style.transform=`translate(${xy[0]}px,${xy[1]}px)`;
  if(cls&&cls.includes('me')){el('circle',{class:'ring',r:11.5},g);}
  el('circle',{class:'body',r:11.5},g);
  el('text',{y:.5},g).textContent=pos;
  return g;
}
function shorten(a,b,s1,s2){const u=unit(sub(b,a));return [add2(a,u,s1),add2(b,u,-s2)];}

/* mode: 'pick' | 'pre' | 'post' */
function drawField(svg,{S,me,mode,onPick,animate=true}){
  const id=drawBase(svg);
  svg.setAttribute('aria-label',S?`${sitTitle(S)}. ${runTxt(S)}.`:u('pickNote'));
  svg.classList.toggle('show',false);
  const lay={mv:el('g',{},svg),hit:el('g',{},svg),thr:el('g',{},svg),run:el('g',{},svg),pl:el('g',{},svg)};
  if(S){
    for(const r of S.run.map(r=>r===1?'1B':'2B')){const p=add2(B[r],r==='1B'?[-9,-11]:[-12,6]);el('circle',{cx:p[0],cy:p[1],r:5.5,fill:'#e4572e',stroke:'#fff','stroke-width':1.3},lay.run);}
    el('circle',{cx:212,cy:378,r:5.5,fill:'#e4572e',stroke:'#fff','stroke-width':1.3},lay.run);
    const sp=spot(S);
    let d;
    if(S.type==='fly'){const m=lerp(H,sp,.5);d=`M200,380 Q${m[0]},${m[1]-70} ${sp[0]},${sp[1]}`;}
    else d=`M200,380 L${sp[0]},${sp[1]}`;
    const hp=el('path',{d,class:'hit'+(S.type==='fly'?' fly':'')},lay.hit);
    if(S.type==='fly') el('circle',{cx:sp[0],cy:sp[1],r:7,fill:'none',stroke:'#fff','stroke-width':1,'stroke-dasharray':'2 2',opacity:.8},lay.hit);
    const ball=el('circle',{cx:sp[0],cy:sp[1],r:3.4,fill:'#fff',stroke:'#555','stroke-width':.8},lay.hit);
    if(animate&&mode==='pre'){
      const Ln=hp.getTotalLength();hp.style.strokeDasharray=`${Ln}`;hp.style.strokeDashoffset=`${Ln}`;ball.style.opacity=0;
      hp.getBoundingClientRect();
      hp.style.transition='stroke-dashoffset .7s ease-out';
      setTimeout(()=>{hp.style.strokeDashoffset='0';},20);
      setTimeout(()=>{hp.style.strokeDasharray='';hp.style.strokeDashoffset='';ball.style.transition='opacity .2s';ball.style.opacity=1;},760);
    }
  }
  const nodes={};
  for(const p of POS){
    nodes[p]=player(lay.pl,p,START[p],p===me?'me':'');
    if(mode==='pick'){nodes[p].addEventListener('click',()=>onPick(p));nodes[p].setAttribute('role','button');nodes[p].setAttribute('aria-label',nm(p));}
  }
  if(me && mode!=='pick'){
    const t=el('g',{class:'pl'},lay.pl);t.style.transform=nodes[me].style.transform;
    el('rect',{x:-11,y:-25,width:22,height:10,rx:3,fill:'var(--me)'},t);
    el('text',{y:-20,class:'tag',style:'fill:#2a1f00'},t).textContent=L('JIJ','YOU');
    nodes._tag=t;
  }
  if(mode==='post' && S){
    const sp=spot(S), T=targets(S);
    for(const p of POS){
      const tg=T[p];
      if(len(sub(tg,START[p]))>6){
        const [a,b]=shorten(START[p],tg,12,12);
        el('path',{d:`M${a[0]},${a[1]} L${b[0]},${b[1]}`,class:'mv'+(p===me?' me':''),'marker-end':`url(#${id}${p===me?'m':'k'})`},lay.mv);
      }
    }
    const go=()=>{
      svg.classList.add('show');
      for(const p of POS){const tg=T[p];nodes[p].style.transform=`translate(${tg[0]}px,${tg[1]}px)`;if(p===me&&nodes._tag)nodes._tag.style.transform=nodes[p].style.transform;}
    };
    if(animate){svg.getBoundingClientRect();setTimeout(go,30);}else{for(const n of Object.values(nodes))n.style.transition='none';svg.querySelectorAll('.mv').forEach(m=>m.style.transition='none');go();}
    const dest=S.to==='H'?add2(B.H,[0,-4]):B[S.to];
    const cp=cutPos(S);
    const fieldAct=S.d[S.ball][0];
    let pts=[sp];
    if(S.type==='fly' && cp) pts.push(T[cp]);
    pts.push(fieldAct==='field_tag3'?B['3B']:dest);
    if(len(sub(pts[pts.length-1],sp))>8){
      const tp=el('path',{d:'M'+pts.map(q=>q.join(',')).join(' L'),class:'throw','marker-end':`url(#${id}r)`},lay.thr);
      if(animate){tp.style.opacity=0;tp.style.transition='opacity .4s';setTimeout(()=>tp.style.opacity=1,1000);}
    }
  }
  return nodes;
}

/* ---------- opslag ---------- */
const store={
  get(){try{return JSON.parse(localStorage.getItem('bbsit-stats')||'{}');}catch(e){return {};}},
  save(s){try{localStorage.setItem('bbsit-stats',JSON.stringify(s));}catch(e){}},
};
let stats=store.get();

/* ---------- start-scherm ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={pos:null,types:new Set(['fly','ground']),runs:new Set(['0','1','2','12']),len:10};
function renderPosGrid(){
  const g=$('#posGrid');g.innerHTML='';
  for(const p of [...POS,'ALL']){
    const b=document.createElement('button');
    b.className='posbtn'+(p==='ALL'?' all':'')+(state.pos===p?' on':'');
    const s=stats[p];
    b.innerHTML = p==='ALL' ? `<b>🎲 ${L('Alle posities door elkaar','All positions mixed')}</b><span>${L('Elke vraag een andere positie','A different position every question')}</span>`
      : `<b>${p}</b><span>${nm(p)}</span>${s&&s.t?`<small>${Math.round(100*s.c/s.t)}% ${L('goed','correct')} (${s.t})</small>`:''}`;
    b.onclick=()=>{state.pos=p;renderSetup();};
    g.appendChild(b);
  }
}
function pool(){
  const sits=SIT.filter(S=>state.types.has(S.type)&&state.runs.has(runKey(S)));
  if(!state.pos) return [];
  if(state.pos==='ALL') return sits.flatMap(S=>POS.map(p=>({S,pos:p})));
  return sits.map(S=>({S,pos:state.pos}));
}
function renderSetup(){
  renderPosGrid();
  drawField($('#pickField'),{mode:'pick',me:state.pos==='ALL'?null:state.pos,onPick:p=>{state.pos=p;renderSetup();}});
  const n=pool().length;
  $('#startBtn').disabled=!n;
  $('#startBtn').textContent=state.pos?(state.pos==='ALL'?L('Start: alle posities','Start: all positions'):L(`Start als ${nm(state.pos).toLowerCase()}`,`Start as ${nm(state.pos).toLowerCase()}`)):L('Kies eerst een positie','Pick a position first');
  $('#poolNote').textContent=state.pos?(n?L(`${n} situatie${n===1?'':'s'} beschikbaar met deze filters.`,`${n} situation${n===1?'':'s'} available with these filters.`):L('Geen situaties met deze filters.','No situations with these filters.')):'';
}
function chipGroup(sel,set){
  document.querySelectorAll(sel+' .chip').forEach(c=>c.onclick=()=>{
    const v=c.dataset.v;
    if(set.has(v)){if(set.size>1)set.delete(v);}else set.add(v);
    c.classList.toggle('on',set.has(v));renderSetup();
  });
}
chipGroup('#fType',state.types);chipGroup('#fRun',state.runs);
document.querySelectorAll('#fLen .chip').forEach(c=>c.onclick=()=>{state.len=+c.dataset.v;document.querySelectorAll('#fLen .chip').forEach(x=>x.classList.toggle('on',x===c));});

/* ---------- spel ---------- */
let round=null;
function startRound(items){
  round={items,i:0,score:0,miss:[],pick:null};
  show('play');nextQ();
}
$('#startBtn').onclick=()=>{
  const p=shuffle(pool());
  // bij "alle posities": niet twee keer achter elkaar dezelfde situatie
  if(state.pos==='ALL'){for(let i=1;i<p.length;i++)if(p[i].S===p[i-1].S){const j=p.findIndex((x,k)=>k>i&&x.S!==p[i-1].S);if(j>0)[p[i],p[j]]=[p[j],p[i]];}}
  startRound(p.slice(0,state.len));
};
function nextQ(){
  if(round.i>=round.items.length) return showResult();
  const {S,pos}=round.items[round.i];
  round.pick=null;round.opts=makeOptions(S,pos);
  renderQuestion();
  drawField($('#playField'),{S,me:pos,mode:'pre'});
  if(window.innerWidth<820) window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuestion(){
  const {S,pos}=round.items[round.i];
  $('#pPos').textContent=`${L('Jij','You')}: ${pos} · ${nm(pos)}`;
  $('#pCount').textContent=`${round.i+1}/${round.items.length}`;
  $('#pProg').style.width=`${100*(round.i+(round.pick!==null?1:0))/round.items.length}%`;
  $('#pScore').textContent=`✓ ${round.score}`;
  $('#sKind').textContent=kindTxt(S);
  $('#sTitle').textContent=sitTitle(S);
  $('#sRun').textContent=runTxt(S);
  $('#sQ').textContent=L(`Jij bent ${de(pos)} (${pos}). Wat doe jij?`,`You are ${de(pos)} (${pos}). What do you do?`);
  const o=$('#opts');o.innerHTML='';
  round.opts.forEach((a,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="k">${i+1}</span><span>${esc(lbl(a))}</span>`;
    b.onclick=()=>answer(i);o.appendChild(b);
  });
  $('#fb').innerHTML='';
  if(round.pick!==null) renderFeedback();
}
function answer(i){
  if(round.pick!==null) return;
  round.pick=i;
  const {S,pos}=round.items[round.i];
  const good=round.opts[i]===S.d[pos][0];
  if(good) round.score++; else round.miss.push(round.items[round.i]);
  const st=stats[pos]||(stats[pos]={c:0,t:0});st.t++;if(good)st.c++;store.save(stats);
  $('#pScore').textContent=`✓ ${round.score}`;
  $('#pProg').style.width=`${100*(round.i+1)/round.items.length}%`;
  renderFeedback();
  drawField($('#playField'),{S,me:pos,mode:'post'});
  if(window.innerWidth<820) setTimeout(()=>$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}
function renderFeedback(){
  const {S,pos}=round.items[round.i];
  const i=round.pick, pick=round.opts[i], correct=S.d[pos][0], good=pick===correct;
  [...$('#opts').children].forEach((b,k)=>{b.disabled=true;const a=round.opts[k];
    if(a===correct)b.classList.add('ok');else if(k===i)b.classList.add('no');else b.classList.add('fade');});
  const last=round.i+1>=round.items.length;
  $('#fb').innerHTML=`
    <div class="fb ${good?'ok':'no'}">
      <h3>${good?L('Goed!','Correct!'):L('Niet helemaal','Not quite')}</h3>
      ${good?'':`<p><b>${L('Jij koos:','You chose:')}</b> ${esc(lbl(pick).toLowerCase())}. ${esc(wrongWhy(S,pos,pick))}</p>`}
      <p><b>${L(`Jouw taak als ${nm(pos).toLowerCase()}:`,`Your job as ${nm(pos).toLowerCase()}:`)}</b> ${esc(lbl(correct).toLowerCase())}.</p>
      <p>${esc(A[correct].why(S,pos))}</p>
      <p class="quote">${L('Uit het boekje','From the booklet')}: “${esc(S.d[pos][1])}”</p>
      <div class="idea"><b>${L('Het idee van deze situatie:','The idea of this situation:')}</b> ${esc(idea(S))}</div>
      <details><summary>${L('Wie doet wat?','Who does what?')}</summary>${whoList(S,pos)}</details>
    </div>
    <div class="next"><button class="btn pri" id="nextBtn">${last?L('Bekijk resultaat','See result'):L('Volgende situatie','Next situation')} →</button></div>`;
  $('#nextBtn').onclick=()=>{round.i++;nextQ();};
}
function whoList(S,me){
  return `<ul class="who">${POS.map(p=>`<li class="${p===me?'me':''}"><b>${p}</b><span>${esc(lbl(S.d[p][0]))}</span></li>`).join('')}</ul>`;
}
document.addEventListener('keydown',e=>{
  if(!$('#play').classList.contains('on')||!round) return;
  if(round.pick===null && /^[1-4]$/.test(e.key)) answer(+e.key-1);
  else if(round.pick!==null && (e.key==='Enter'||e.key===' ')){e.preventDefault();$('#nextBtn')?.click();}
});
$('#stopBtn').onclick=()=>{ if(round.i>0||round.pick!==null){round.items=round.items.slice(0,round.i+(round.pick!==null?1:0));showResult();} else show('setup'); };

function showResult(){ show('result'); renderResult(); }
function renderResult(){
  const n=round.items.length,s=round.score,pct=n?s/n:0;
  $('#rPos').textContent=state.pos==='ALL'?L('Alle posities','All positions'):`${state.pos} · ${PN[state.pos]?nm(state.pos):''}`;
  $('#rScore').textContent=`${s}/${n}`;
  $('#rMsg').textContent=pct===1?L('Foutloos! Jij weet precies waar je moet staan. ⚾','Perfect! You know exactly where to be. ⚾')
    :pct>=.8?L('Sterk gedaan! Nog een paar details en je hebt het helemaal.','Great job! A few details and you\'ve got it all.')
    :pct>=.5?L('Op de goede weg. Kijk de fouten nog eens rustig na.','On the right track. Take another look at your mistakes.')
    :L('Lastig hè? Bekijk de uitleg hieronder en probeer de fouten opnieuw.','Tricky, right? Check the explanations below and retry your mistakes.');
  $('#rMiss').innerHTML=round.miss.length?`<div class="lbl">${L('Nog even oefenen','Keep practising')}</div><ul class="miss">${round.miss.map(({S,pos})=>`<li><div class="t">${pos} · ${esc(sitTitle(S))}, ${esc(runTxt(S).toLowerCase())}</div>${esc(lbl(S.d[pos][0]))}</li>`).join('')}</ul>`:'';
  $('#retryMiss').style.display=round.miss.length?'':'none';
}
$('#retryMiss').onclick=()=>startRound(shuffle(round.miss));
$('#again').onclick=()=>$('#startBtn').click();
$('#toSetup').onclick=()=>show('setup');

/* ---------- studeren ---------- */
const study={S:SIT[0],pos:null};
function renderStudyList(){
  const groups=[['0',L('Geen lopers','No runners')],['1',L('Loper op 1','Runner on 1st')],['2',L('Loper op 2','Runner on 2nd')],['12',L('Lopers op 1 en 2','Runners on 1st & 2nd')]];
  $('#slist').innerHTML=groups.map(([k,t])=>`<div class="sgroup"><h3>${t}</h3><div class="sitems">${
    SIT.filter(S=>runKey(S)===k).map(S=>`<button class="sitem${S===study.S?' on':''}" data-id="${S.id}">${S.type==='fly'?'Fly':L('Grond','Ground')} → ${S.ball}</button>`).join('')}</div></div>`).join('');
  $('#slist').querySelectorAll('.sitem').forEach(b=>b.onclick=()=>{study.S=SIT[+b.dataset.id];renderStudy();
    if(window.innerWidth<820)$('#studyField').scrollIntoView({behavior:'smooth',block:'start'});});
}
function renderStudy(animate=true){
  renderStudyList();
  const S=study.S;
  $('#tKind').textContent=kindTxt(S);
  $('#tTitle').textContent=sitTitle(S);
  $('#tRun').textContent=runTxt(S);
  $('#tIdea').innerHTML=`<b>${L('Het idee:','The idea:')}</b> ${esc(idea(S))}`;
  $('#tWho').innerHTML=POS.map(p=>`<li data-pos="${p}" class="${p===study.pos?'me':''}"><div class="h"><b>${p}</b><span>${esc(lbl(S.d[p][0]))}</span></div><div class="why">${esc(A[S.d[p][0]].why(S,p))}<br><span class="quote">“${esc(S.d[p][1])}”</span></div></li>`).join('');
  $('#tWho').querySelectorAll('li').forEach(li=>li.onclick=()=>{study.pos=study.pos===li.dataset.pos?null:li.dataset.pos;renderStudy(false);});
  drawField($('#studyField'),{S,me:study.pos,mode:'post',animate});
}
$('#replay').onclick=()=>renderStudy(true);

/* ---------- navigatie & taal ---------- */
let current='setup';
function show(id){
  current=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  const tab=id==='study'?'study':'setup';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  if(id==='setup'){stats=store.get();renderSetup();}
  if(id==='study') renderStudy();
  window.scrollTo(0,0);
}
function setLang(l){
  LANG=l; try{localStorage.setItem('bbsit-lang',l);}catch(e){}
  applyStatic();
  if(current==='setup') renderSetup();
  else if(current==='study') renderStudy(false);
  else if(current==='result') renderResult();
  else if(current==='play'){
    const {S,pos}=round.items[round.i];
    renderQuestion();
    drawField($('#playField'),{S,me:pos,mode:round.pick!==null?'post':'pre',animate:false});
  }
}
document.querySelectorAll('.langtg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#home').onclick=()=>show('setup');
applyStatic();
renderSetup();
</script>
</body>
</html>
